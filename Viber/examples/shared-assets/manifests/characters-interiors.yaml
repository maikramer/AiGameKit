# NPCs de INTERIOR — o povo que vive dentro das casas (o elenco de rua já
# existe em manifests/characters.yaml: merchant, healer, blacksmith, guard,
# elder, scout). Manifest PRÓPRIO de propósito: `resume` só corre as fases
# pendentes, e um ficheiro separado garante que nenhum asset já pronto do
# pack `characters` é tocado por este lote.
#
# Regenerar:
#   cd Viber/examples/shared-assets
#   ../../GameAssets/.venv/bin/python -m gameassets resume \
#       --profile game.yaml --manifest manifests/characters-interiors
output_dir: ../public/assets
meshes_subdir: meshes/characters
images_subdir: images/characters
assets:
  - id: npc_innkeeper
    idea:
      friendly cartoon innkeeper NPC wearing a stained apron over a rolled-sleeve
      shirt, towel over one shoulder, sturdy build, warm welcoming smile, standing
      upright in relaxed A-pose with arms angled down at 45 degrees away from the
      body, visible gap between arms and torso, open hands with spread fingers,
      hands empty, no weapons, no props, full body visible, front-facing, fantasy
      tavern keeper
    kind: character
    category: humanoid
    pipeline:
      - 3d
      - paint
      - rig
      - animate
      - lod
      - collision
    lod_levels: 1
    animate:
      preset: humanoid
      force_preset: true
      clips: idle,walk,talk,call,foldarms,eat,yes,no
    omni:
      control_type: pose
      pose_preset: quaternius-apose
      size_m:
        - 0.7
        - 1.6
        - 0.55

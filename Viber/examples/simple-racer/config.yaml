# config.yaml — contrato de paths do jogo com a engine (docs/ASSETS.md).
# Relativos a ESTA pasta. Obrigatório: o run/analyze não arranca sem ele.
title: Simple Racer
# Preset da lente (docs/PERFORMANCE.md): alto | equilibrado | desempenho.
graphics: equilibrado

# Preset de gameplay: `racing` = karts (`<Vehicle>`), diretor de corrida,
# rivais AI e som de motor. O preset RPG fica OFF.
gameplay: racing

assets:
  # Roots extra, por ordem, DEPOIS da pasta do jogo (que é sempre a 1.ª).
  roots:
    - ../shared-assets/public          # o pool partilhado do monorepo
  bgm_dir: assets/audio/bgm            # <MusicLayer layer="race"> → race.ogg
  sfx_dir: assets/audio/sfx            # clips da engine → {sfx_dir}/…
  terrain_textures_dir: assets/textures

game:
  scripts_dir: scripts                 # script="x.lua" + hot-reload

save:
  dir: ~/.local/share/viber            # {dir}/{mundo}.save.json (~ ok)

# Cenas (Unity/Godot): world.xml é a cena principal. Autoloads = o que
# atravessa as cenas (kart do jogador + câmara + HUD).
project:
  main-scene: world.xml
  scenes: scenes
  autoload:
    - world/autoload/player.xml
    - world/autoload/ui.xml

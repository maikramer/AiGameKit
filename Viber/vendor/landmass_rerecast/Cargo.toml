[package]
name = "landmass_rerecast"
version = "0.3.0"
edition = "2024"

description = "An integration to allow use of rerecast navigation meshes in landmass."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/andriyDev/landmass"

categories = ["game-development"]
keywords = ["navigation", "system", "pathfinding"]

[dependencies]
bevy_landmass = { path = "../bevy_landmass", default-features = false }

bevy_app = { version = "0.20.0-rc.2", default-features = false }
bevy_asset = { version = "0.20.0-rc.2", default-features = false }
bevy_ecs = { version = "0.20.0-rc.2", default-features = false }
bevy_log = { version = "0.20.0-rc.2", default-features = false }
bevy_math = { version = "0.20.0-rc.2", default-features = false }
bevy_platform = { version = "0.20.0-rc.2", default-features = false }

bevy_rerecast = { path = "../bevy_rerecast", default-features = false }


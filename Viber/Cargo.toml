[package]
name = "viber"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Viber — native Bevy engine for AiGameKit declarative world XML"
license = "MIT"
repository = "https://github.com/maikeu/AiGameKit"
keywords = ["gamedev", "bevy", "engine", "xml"]
categories = ["game-development"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bevy = { version = "0.19", features = ["bevy_remote", "jpeg", "webp"] }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[package]
name = "viber"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Viber — native Bevy engine for AiGameKit declarative world XML"
license = "MIT"
repository = "https://github.com/maikeu/AiGameKit"
keywords = ["gamedev", "bevy", "engine", "xml"]
categories = ["game-development"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bevy = { version = "0.19", features = ["bevy_remote", "jpeg", "webp"] }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

flate2 = "1"
# `async-collider` gives `Collider::from_bevy_mesh` (trimesh/convex colliders
# baked from glTF meshes); `debug-render-3d` draws collider wireframes so
# collision can be verified in a screenshot.
bevy_rapier3d = { version = "0.36", features = ["async-collider", "debug-render-3d"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

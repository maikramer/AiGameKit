# Quality profiles — cross-tool parameter mapping.
# Each tier maps per-tool settings for the full pipeline.
#
# Usage:
#   engine = QualityEngine()
#   r = engine.resolve("text2sound", quality="medium", category="weapon")

profiles:
  fast:
    label: "Fast (~30s/asset, minimum viable quality)"
    text2d:
      width: 512
      height: 512
      steps: 4
      guidance: 1.0
    text2icon:
      width: 512
      height: 512
      steps: 8
      guidance: 4.0
    text3d:
      preset: fast
      guidance: 4.5
    paint3d:
      max_views: 2
      view_resolution: 384
      render_size: 1024
      texture_size: 1024
      bake_exp: 6
      smooth: true
      smooth_passes: 2
    texture2d:
      width: 512
      height: 512
      steps: 16
      guidance: 7.0
    skymap2d:
      width: 1024
      height: 512
      steps: 14
      guidance: 3.0
    text2sound:
      steps: 12
      cfg_scale: 4.0
      sigma_min: 0.5
      sigma_max: 500.0
      sampler: dpmpp-3m-sde
      crossfade_ms: 300
      # DSP mastering chain (pedalboard)
      lufs_target: -18       # quieter target for fast previews
      high_pass_hz: 40
      compressor: false      # skip compressor to save CPU on fast tier
      true_peak_db: -1.0
      headroom_db: 0.3
      ogg_quality: 0.5
      enhance: false         # skip prompt enhancement on fast tier
    simplify:
      face_ratio: 0.25
      texture_size: 1024
    rigging3d:
      groups_per_vertex: 4
    terrain3d:
      size: 512
      world_size: 256.0
      coarse_window: 2
      island_noise_scale: 0.12
      island_noise_freq: 2.5
      smooth_iterations: 2
      elevation_gamma: 1.1
      elevation_contrast: 0.05
    rocks3d:
      subdivisions: 2
      octaves: 2
      frequency: 3.0
      amplitude: 0.15
      erosion_passes: 0
      texture_resolution: 256
    part3d:
      steps: 15
      octree: 128
      chunks: 10000
      volume_decoder: flashvdm
      mc_algo: mc
      point_num: 32000
      prompt_num: 48
      postprocess_threshold: 0.95


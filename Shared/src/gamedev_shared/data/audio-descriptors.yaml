# Negative descriptors appended to the negative prompt when enhancement is on.
# These apply regardless of sound type and combine with the audio_kind's own
# negative_prompt_hint (they don't replace it). Curated to steer Stable Audio
# away from common artifacts.
negative_descriptors:
  - "low quality"
  - "distortion"
  - "clipping"
  - "artifacts"
  - "noise floor"
  - "muddy"
  - "harsh"
  - "metallic ringing"
  - "phase issues"

# Weak / generic terms that signal a low-effort prompt. When detected the
# prompt is considered "weak" and enhancement is more aggressive (adds more
# descriptors, treats it closer to a fallback). These are matched as
# case-insensitive substrings.
weak_terms:
  - "good sound"
  - "nice audio"
  - "cool effect"
  - "some sound"
  - "a sound"
  - "sound effect" # alone is too generic
  - "nice sound"
  - "cool sound"
  - "best sound"
  - "audio clip"

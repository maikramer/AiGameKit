      - "crisp interface sound"
      - "minimal"
    dynamics:
      - "short"
      - "punchy"
    context:
      - "interface"
      - "no reverb"
  mechanical:
    texture:
      - "metallic gears"
      - "mechanical detail"
      - "weighted mechanism"
    dynamics:
      - "deliberate motion"
      - "articulated"
    context:
      - "industrial"
      - "physical"
  elemental:
    texture:
      - "elemental energy"
      - "natural texture"
      - "raw force"
    dynamics:
      - "dynamic swell"
      - "evolving"
    context:
      - "nature"
      - "immersive"
  collectible:

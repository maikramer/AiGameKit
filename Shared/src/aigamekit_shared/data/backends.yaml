# Registry declarativo de backends do vramd (supervisor de VRAM do monorepo).
#
# Cada backend é uma ferramenta GPU do monorepo. O vramd spawna um worker
# persistente por backend no venv da tool: ``<Tool>/.venv/bin/python -m <tool>
# serve --ums-worker`` (JSONL stdin/stdout — ver aigamekit_shared.worker_serve).
#
# vram_mib: estimativa estática (MiB) — fallback se footprint_key falhar.
# footprint_key: chave do registry de footprints do vramd (vramd.footprints).
#   O vramd admite jobs com peak = pesos(quant) + activation_gib + safety — NÃO
#   só pesos. GPUs ~6 GB recusam text3d fp16 full; usam sdnq-int4.
# priority: prioridade de evicção. Valores MAIORES = mais pesado/urgente de MANTER
#   carregado (menos provável de ser evicted). Backends leves (priority baixa)
#   são evicted primeiro quando a VRAM escasseia. Tie-break: LRU.
# adapter: campo obrigatório do schema v2, mas IGNORADO no modo subprocesso
#   (``tool:`` definido) — aponta para um módulo importável da shared só para
#   o schema não falhar. O modo in-process (sem ``tool:``) deixou de ser
#   suportado: o supervisor (venv Vramd/) não tem as deps torch das tools.
# tool: nome da tool monorepo — o vramd deriva o interpretador do venv a partir
#   de VRAMD_TOOLS_ROOT (o checkout) e corre ``serve --ums-worker``.
# Env VRAMD_SUBPROCESS=0 desliga o modo subprocesso (rollback, não suportado
# sem adapters in-process).
#
# calibrate_request / calibrate_load_kwargs: o que `vramd calibrate <backend>`
# usa por default (job representativo). Nomes curtos de inputs (test-mesh.glb,
# test-image.png) resolvem para o package data do vramd — o utilizador não
# precisa de ter um modelo de teste.

backends:
  - name: texture2d
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 2500
    footprint_key: sd15-base
    priority: 20
    tool: texture2d
    # Contrato de ficheiros para o vramd remoto (ver vramd_remote.py): campos do
    # payload que são inputs/outputs e os sidecars escritos ao lado do output.
    remote:
      outputs: [output]
      sidecars: ["{stem}.json"]
    # Calibrar o path de produção: GO+streams (default das tools 2D). O
    # load_kwargs grava ``allow_group_offload`` no descriptor — o admit 0.3.7+
    # só usa a medição para requests do mesmo modo.
    calibrate_load_kwargs:
      memory_efficient: true
      allow_group_offload: true
    calibrate_request:
      prompt: "seamless red brick wall"
      output: "/tmp/vramd-calibrate-texture2d.png"

  - name: text2d
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 4500
    footprint_key: flux3-klein
    priority: 25
    tool: text2d
    remote:
      inputs: [refs]
      outputs: [output]
      # num_images>1 escreve <stem>_1.png … ao lado do output principal.
      sidecar_globs: ["{stem}_*{suffix}"]
    session:
      env: text2d
      tool: text2d
      code_roots: [Shared/src, Text2D/src]
    models:
      - repo: black-forest-labs/flux-3-image-klein
        ignore: ["variants/*", "model.safetensors", "*.md"]
    # FLUX.3 Klein: ``upsample`` escolhe se o prompt upsampler 9B (pup) é
    # carregado — é decisão de LOAD (pop do bloco) e SHAPE (mudar exige reload).
    # Declarar as listas substitui a allowlist global do vramd, por isso incluem
    # tudo o que o ctor/admit do text2d usa.
    load_keys:
      - verbose
      - sdnq_preset
      - quant_mode
      - gpu_ids
      - offload
      - memory_efficient
      - torch_compile
      - torch_compile_mode
      - channels_last
      - allow_group_offload
      - model_id
      - quant_preset
      - step_cache
      - upsample
    shape_keys:
      - memory_efficient
      - sdnq_preset
      - quant_mode
      - allow_group_offload
      - gpu_ids
      - offload
      - channels_last
      - torch_compile
      - torch_compile_mode
      - model_id
      - step_cache
      - upsample
    peak_profile:
      memory_efficient_with_quant: true
      streams_on_load_with_memory_efficient: true
    calibrate_request:
      prompt: "a red cube on a white background"
      output: "/tmp/vramd-calibrate-text2d.png"
    # Calibrar o path de produção: GO+streams+int4 (o modo default do hw-auto
    # em GPUs apertadas). O load_kwargs grava ``allow_group_offload`` no
    # descriptor — o admit 0.3.7+ só usa a medição para requests do mesmo modo.
    calibrate_load_kwargs:
      quant_preset: sdnq-int4
      memory_efficient: true
      allow_group_offload: true

  - name: skymap2d
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 7000
    footprint_key: flux-dev-uint4
    priority: 25
    tool: skymap2d
    remote:
      outputs: [output]
      sidecars: ["{stem}.json"]
    calibrate_request:
      prompt: "stormy sky over mountains"
      output: "/tmp/vramd-calibrate-skymap2d.png"
    # Calibrar o path GO de produção (o modo default do hw-auto em GPUs
    # apertadas); o admit 0.3.7+ só usa a medição para requests do mesmo modo.
    calibrate_load_kwargs:
      memory_efficient: true
      allow_group_offload: true

  - name: text3d
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 10000
    footprint_key: hunyuan3d-omni
    priority: 40
    tool: text3d
    remote:
      inputs: [from_image, pose_file, point_cloud, voxel_mesh]
      outputs: [output]
      sidecars: ["{output}.omni.json"]
    session:
      env: text3d
      tool: text3d
      code_roots: [Shared/src, Text2D/src, Text3D/src]
    models:
      - repo: tencent/Hunyuan3D-Omni
      - repo: black-forest-labs/flux-3-image-klein
        ignore: ["variants/*", "model.safetensors", "*.md"]
      - repo: ZhengPeng7/BiRefNet
      - repo: facebook/dinov2-large
    peak_profile:
      memory_efficient_with_quant: true
      group_offload_with_memory_efficient: true
    calibrate_request:
      from_image: "test-image.png"
      output: "/tmp/vramd-calibrate-text3d.glb"

  - name: paint3d
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 4000
    footprint_key: hunyuan-paint
    priority: 40
    tool: paint3d
    remote:
      inputs: [mesh_path, image_path, images]
      outputs: [output]
    session:
      env: paint3d
      tool: paint3d
      code_roots: [Shared/src, Paint3D/src]
    models:
      - repo: tencent/Hunyuan3D-2.1
        allow: ["hunyuan3d-paintpbr-v2-1/*", "*.json", "*.yaml"]
      - repo: facebook/dinov2-giant
    peak_profile:
      memory_efficient_with_quant: true
    calibrate_request:
      mesh_path: "test-mesh.glb"
      image_path: "test-image.png"
      output: "/tmp/vramd-calibrate-paint3d.glb"
    # Calibrar o path de produção das GPUs pequenas: SDNQ uint8 (com codebook
    # Lloyd-Max desde a 0.2.6) + group offload. O load_kwargs grava
    # ``allow_group_offload`` no descriptor — o admit 0.3.7+ só usa a medição
    # para requests do mesmo modo.
    calibrate_load_kwargs:
      sdnq_preset: sdnq-uint8
      memory_efficient: true
      allow_group_offload: true

  - name: part3d
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 5200
    footprint_key: hunyuan3d-part
    priority: 35
    tool: part3d
    remote:
      inputs: [mesh_path, segmentation_proxy]
      outputs: [output, output_segmented]
    calibrate_request:
      mesh_path: "test-mesh.glb"
      output: "/tmp/vramd-calibrate-part3d.glb"
      output_segmented: "/tmp/vramd-calibrate-part3d-seg.glb"
    calibrate_load_kwargs:
      sdnq_preset: sdnq-fp8

  # Auto-rigging SkinTokens (skeleton + skin numa passada). O adapter do
  # worker vive em Rigging3D/src/rigging3d/worker_serve_adapter.py; os
  # checkpoints ficam no cache HF normal (VAST-AI/SkinTokens) e o runner liga-os
  # ao layout ``experiments/...`` que o TokenRig espera. O bpy corre no worker
  # (headless) para o dataloader/export/transfer. Sem spconv/cumm no lock
  # remoto: o SkinTokens não os importa e não há wheel cu13.
  - name: rigging3d
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 7000
    priority: 35
    tool: rigging3d
    remote:
      inputs: [input]
      outputs: [output]
    session:
      env: rigging3d
      tool: rigging3d
      code_roots: [Shared/src, Rigging3D/src]
    models:
      - repo: VAST-AI/SkinTokens
        allow:
          - experiments/articulation_xl_quantization_256_token_4/grpo_1400.ckpt
          - experiments/skin_vae_2_10_32768/last.ckpt

  # Refinamento de geometria Hi3D (sparc3d). Medido nesta GPU de 6 GB:
  # 512³ / 25 passos com **residência por fase** (default) → pico 3,74 GiB,
  # ~60 s por asset; com `--no-staging` (offload sequencial do accelerate) o
  # pico é 0,9 GiB mas leva ~137 s. O admit tem de assumir o modo default:
  # 4300 MiB. 1024³/1536³ só em GPUs grandes (o admit por job não conhece a
  # resolução). O worker corre no venv 3.10 próprio (`Hi3D/.venv`) com
  # protocolo JSONL local (ver Hi3D/src/hi3d/ums.py).
  - name: hi3d
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 4300
    priority: 35
    tool: hi3d
    remote:
      inputs: [coarse_mesh, image]
      outputs: [output]
    # Sem `session:`: o Hi3D (refine) fica **local**. O stack é Python 3.10 +
    # torch 2.5.0+cu124 (spconv-cu120/flash-attn), sem build cu13; não entra no
    # bundle/sessão remota nem no servidor. O refine corre no vramd local.
    models:
      - repo: hi3d-official/Hi3Dv1.0
    calibrate_request:
      coarse_mesh: "test-mesh.glb"
      image: "test-image.png"
      output: "/tmp/vramd-calibrate-hi3d.glb"
      resolution: 512
      num_inference_steps: 5

  - name: text2sound
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 5000
    footprint_key: stable-audio-open
    priority: 30
    tool: text2sound
    remote:
      outputs: [output]
      sidecars: ["{output}.json"]
    session:
      env: text2sound
      tool: text2sound
      code_roots: [Shared/src, Text2Sound/src]
    models:
      - repo: stabilityai/stable-audio-3-small-music
      - repo: stabilityai/stable-audio-3-small-sfx
    calibrate_request:
      prompt: "soft pad"
      output: "/tmp/vramd-calibrate-text2sound.wav"

  - name: terrain3d
    adapter: aigamekit_shared.worker_serve_adapter_base
    # Medido: pesos fp32 reais ~1.1 GiB (coarse 11M + base 968M + decoder 107M)
    # + activações (tiles 512², warmup bs<=16) ~0.7 GiB + contexto CUDA.
    # 6000 era ~2x conservador e recusava GPUs de 6 GB (peak 6384 > 5627 livre).
    vram_mib: 3200
    priority: 40
    tool: terrain3d
    remote:
      outputs: [output, metadata_path]
    calibrate_request:
      prompt: "mountain valley"
      output: "/tmp/vramd-calibrate-terrain3d.glb"

  # Decomposição intrínseca (compphoto/Intrinsic, licença ACADEMIA-ONLY +
  # patente pendente — ver Intrinsic/README.md). Módulo intrinsic_worker para
  # não colidir com o módulo `intrinsic` do upstream.
  - name: intrinsic
    adapter: aigamekit_shared.worker_serve_adapter_base
    vram_mib: 3200
    priority: 25
    tool: intrinsic
    runtime:
      command:
        - "${monorepo:intrinsic}"
        - "-m"
        - "intrinsic_worker"
        - "serve"
        - "--ums-worker"
    calibrate_request:
      image_path: "test-image.png"
      output_dir: "/tmp/vramd-calibrate-intrinsic"

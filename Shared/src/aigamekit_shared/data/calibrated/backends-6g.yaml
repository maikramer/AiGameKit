# Descriptor de backends calibrado — RTX 4050 Laptop 6 GB (vramd calibrate).
# NÃO editar à mão. Gerado por `vramd calibrate` em hardware real; os valores
# em `vram:` são MEDIDOS (driver, por processo), não estimados.
#
# Catálogo por VRAM: um ficheiro por capacidade de GPU (backends-6g.yaml,
# backends-16g.yaml…). O auto-start escolhe o ficheiro com a maior etiqueta
# ≤ VRAM total da GPU; sem calibração para o hardware, usa estimativas + hw-auto.
#
# O hw-auto de produção (with_vramd_peak_opts) pede o config que FOI medido
# (peak_profile.quant_mode + load_kwargs) — quant match garante que o admit
# usa estes números. Em hardware com FP8, uint8 → sdnq-fp8 (mesma VRAM).

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2icon"
version = "0.1.0"
description = "CLI text-to-icon com Sana Sprint 0.6B (1-4 passos) para UI/icons de jogos"
readme = "README.md"
authors = [{ name = "Text2Icon Project" }]
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "diffusers>=0.38.0",
    "transformers>=5.14.0",
    "accelerate>=0.24.0",
    "huggingface-hub>=1.5.0,<2",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "rembg>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "rich-click>=1.8.0",
    "aigamekit-shared[gpu,image] @ file:../Shared",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
text2icon = "text2icon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
text2icon = ["cursor_skill/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

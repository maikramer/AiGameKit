[package]
name = "vibereditor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Godot-style editor for Viber worlds: in-process scene editing, Play as a separate game process"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
bevy = { version = "0.20", features = ["bevy_feathers"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
# Mesma versão/features do engine (reutiliza o luau vendored do target):
# o editor compila scripts Luau (SEM executar) para apanhar erros de
# sintaxe no save/abertura.
mlua = { version = "0.12", features = ["luau", "vendored", "send"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engine as a library: the editor renders and edits the world in-process
# (`viber::app::build_app` in `RunMode::Edit`).
viber = { path = "../Viber" }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
# Disco: cada binário de teste (tests/*.rs) linka o engine inteiro; com o
# debuginfo embutido eram ~2,6 GB POR binário (123 GB medidos em
# target/debug/deps, 2026-10-13). `unpacked` deixa o debuginfo nos objetos
# (partilhados) em vez de o copiar para cada executável.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
# Sem debuginfo nas dependências (Bevy/Rapier/wgpu): era o grosso do peso e
# ninguém faz step-debug dentro delas. Backtraces mantêm os nomes.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

# Mirror of Viber's own patch (patches only apply from the root manifest).
[patch.crates-io]
rerecast = { path = "../Viber/vendor/rerecast" }

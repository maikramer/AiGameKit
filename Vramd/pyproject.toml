[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigamekit-vramd"
version = "0.4.0"
description = "Supervisor de VRAM do AiGameKit — pin do vramd no venv canónico"
readme = "README.md"
authors = [{ name = "AiGameKit Project" }]
requires-python = ">=3.13,<3.14"
license = "MIT"
# O supervisor vem do PyPI (`pip install vramd` no Vramd/.venv — o
# `./install.sh vramd` refresca). O clone irmão ~/GitClones/vramd é o upstream
# de desenvolvimento: só se instala editável quando se está a desenvolver o
# próprio vramd, nunca como dependência do monorepo.
# 0.7.0: router/topologia (`topology`, `hw_tiers`) e o protocolo binário de
# blobs que o cliente do Shared usa (frames + CAS). O piso acompanha o
# `Shared/pyproject.toml` (>=0.7.0): com 0.6 o staging remoto caía no caminho
# JSON/base64 e não havia topologia para dimensionar a fila.
dependencies = [
    "vramd>=0.7.0",
]

[project.scripts]
vramd = "vramd.cli:main"


[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigamekit-vramd"
version = "0.2.0"
description = "Supervisor de VRAM do AiGameKit — wrapper da tool vramd (PyPI)"
readme = "README.md"
authors = [{ name = "AiGameKit Project" }]
requires-python = ">=3.13,<3.14"
license = "MIT"
# O supervisor vem do PyPI; esta pasta só amarra a versão ao venv canónico
# (Vramd/.venv) que o cliente Shared procura para o auto-start.
dependencies = [
    "vramd==0.2.0",
]

[project.scripts]
vramd = "vramd.cli:main"

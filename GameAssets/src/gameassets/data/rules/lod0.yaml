# Regras de validação para o GLB LOD0 (master).
# Aplicado pelo orquestrador via:
#   aigamekit-lab check glb id_lod0.glb rules/lod0.yaml --category <cat>

mesh_totals:
  v_per_tri:
    max: 1.6
  vertex_count:
    min: 8
    max: 200000

attributes_required:
  - POSITION
  - NORMAL
  - TEXCOORD_0
  - TANGENT

texture_format: ktx2
compression: meshopt

origin:
  y_min:
    near: 0.0
    tol: 0.05

# Limites por categoria (LOD0 = 1.2× target_faces da categoria, com folga).
# ATENÇÃO: com `--painted-mesh` o `text3d lod` não desce ao target — o LOD0
# fica no **piso das costuras UV** do atlas (medido 2026-10-30: 57k num cliff
# de 2.1×3 m e 71k numa mesa/bar). Os caps antigos (terrain 19.2k, furniture
# 9.6k) eram inatingíveis e rejeitavam assets válidos. Valores abaixo =
# observado + folga para o piso variar com o nº de ilhas.
face_count:
  max_per_category:
    humanoid: 48000
    # creature: bosses `generation: high` dão 57.6k.
    creature: 80000
    chest: 24000
    weapon: 16000
    tree: 24000
    rock: 24000
    mineral: 16000
    building: 96000
    furniture: 96000
    vegetation: 32000
    vehicle: 40000
    armor: 32000
    food: 8000
    tool: 16000
    terrain: 96000
    effects: 4800

meshes_min: 1

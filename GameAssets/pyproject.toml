[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gameassets"
version = "0.2.2"
description = "CLI para batches de prompts e assets 2D/3D alinhados ao estilo do jogo"
readme = "README.md"
authors = [{ name = "AiGameKit" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.0",
    "rich-click>=1.8.0",
    "textual>=3.0",
    "Pillow>=10.0",
    "aigamekit-shared @ file:../Shared",
    # O GameAssets não importa o modelserver (fala com o UMS via socket/subprocess
    # — aigamekit_shared.model_server). Declarar `modelserver @ file:` faria o uv
    # copiar o supervisor para este venv (ferramenta dentro de ferramenta); quem
    # cuida das interações é o UMS (auto-start / subprocess workers).
    "bpy>=5.2.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
gameassets = "gameassets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gameassets = ["data/*.yaml", "cursor_skill/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Release workflow — GitHub Release por tag.
#
# Fluxo normal: `git tag -a v<N> && git push origin v<N>` → o job
# `github-release` cria a GitHub Release com as notes geradas + a entrada do
# CHANGELOG.md.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  github-release:
    name: GitHub Release (tag push)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract CHANGELOG entry for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Secção ## [v<N>] — ... até à próxima secção ## (exclusivé).
          awk -v tag="## [${GITHUB_REF_NAME}]" '
            index($0, tag) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "_(sem entrada ${GITHUB_REF_NAME} no CHANGELOG.md — ver commits)_" > body.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: body.md
          generate_release_notes: true
          draft: false

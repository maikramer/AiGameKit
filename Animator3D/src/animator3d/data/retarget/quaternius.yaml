# Perfil de retarget: Quaternius Universal Animation Library (CC0)
#
# Pack: https://quaternius.itch.io/universal-animation-library
# Rig source: UE5 Mannequin naming (pelvis, spine_01, upperarm_l, thigh_r, ...).
# O rig alvo (simple-rpg / Rigging3D) usa naming Mixamo sem prefixo
# (Hips, Spine, LeftArm, LeftUpLeg, ...).
#
# Método de retarget: cópia do matrix_basis (rotação local pura, delta vs rest).
# Funciona porque ambos os rigs são humanoides em pé com naming 1:1 — o matrix_basis
# é relativo ao rest de cada osso, absorvendo a diferença T-pose vs A-pose.

profile: quaternius

# Mapeamento de bones: source (Quaternius) -> target (rig alvo, Mixamo-like).
# Osso do source não mapeado -> ignorado. Osso do target sem correspondência
# -> fica estático (mantém rest pose).
bone_map:
  pelvis: Hips
  spine_01: Spine
  spine_02: Chest
  spine_03: UpperChest
  neck_01: Neck
  Head: Head
  clavicle_l: LeftShoulder
  upperarm_l: LeftArm
  lowerarm_l: LeftForeArm
  hand_l: LeftHand
  clavicle_r: RightShoulder
  upperarm_r: RightArm
  lowerarm_r: RightForeArm
  hand_r: RightHand
  thigh_l: LeftUpLeg
  calf_l: LeftLeg
  foot_l: LeftFoot
  ball_l: LeftToeBase
  thigh_r: RightUpLeg
  calf_r: RightLeg
  foot_r: RightFoot
  ball_r: RightToeBase

# Mapeamento de clips: nome limpo de saída -> nome da action/track no pack source.
# Apenas os clips listados são retargetizados; outros no pack são ignorados.
clip_map:
  idle: Idle_Loop
  walk: Walk_Loop
  run: Jog_Fwd_Loop
  sprint: Sprint_Loop
  jump: Jump_Start
  attack: Sword_Attack
  punch: Punch_Cross
  hit: Hit_Chest
  death: Death01
  roar: Dance_Loop
  roll: Roll
  interact: Interact

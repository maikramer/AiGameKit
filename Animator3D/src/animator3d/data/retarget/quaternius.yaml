# Perfil de retarget: Quaternius Universal Animation Library (CC0)
#
# Pack: https://quaternius.itch.io/universal-animation-library
# Rig source: UE5 Mannequin naming (pelvis, spine_01, upperarm_l, thigh_r, ...).
# O rig alvo (Rigging3D) usa o MESMO naming por convenção — mapeamento
# identidade. Rigs antigos com naming Mixamo sem prefixo (Hips, Spine,
# LeftArm, ...) são cobertos por aliases.
#
# Método de retarget: o target adopta a pose global absoluta do Quaternius por
# osso. A correção fixa remove o swing entre as direções de rest (T-pose vs
# A-pose) para que a diferença de rest não seja re-aplicada como delta.

profile: quaternius

# Pack source para auto-download (aigamekit_shared.quaternius_fetch).
source_pack: quaternius

# Mapeamento de bones: source (Quaternius) -> target. O naming canónico dos
# rigs do pipeline (Rigging3D) É o naming Quaternius/UE5, logo o mapeamento é
# identidade; os aliases seguintes (Mixamo-like) cobrem rigs antigos. O valor
# pode ser string ou lista de candidatos — o primeiro que existir no rig ganha.
# Osso do source não mapeado -> ignorado. Osso do target sem correspondência
# -> fica estático (mantém rest pose).
bone_map:
  # ``root`` NÃO entra no map: ``ensure_feet_root_bone`` cria-o nos pés e
  # deixa-o estático (identidade). Retargetar rotação do root Quaternius
  # injecta quat ±90° (Y-up↔Z-up) e ao play a origem salta para a cintura.
  # Location do pelvis (bob) continua — é o que planta o gait.
  pelvis: [pelvis, Hips]
  spine_01: [spine_01, Spine]
  spine_02: [spine_02, Chest]
  spine_03: [spine_03, UpperChest]
  neck_01: [neck_01, Neck]
  Head: [Head]
  clavicle_l: [clavicle_l, LeftShoulder]
  upperarm_l: [upperarm_l, LeftArm]
  lowerarm_l: [lowerarm_l, LeftForeArm]
  hand_l: [hand_l, LeftHand]
  clavicle_r: [clavicle_r, RightShoulder]
  upperarm_r: [upperarm_r, RightArm]
  lowerarm_r: [lowerarm_r, RightForeArm]
  hand_r: [hand_r, RightHand]
  thigh_l: [thigh_l, LeftUpLeg]
  calf_l: [calf_l, LeftLeg]
  foot_l: [foot_l, LeftFoot]
  ball_l: [ball_l, LeftToeBase]
  thigh_r: [thigh_r, RightUpLeg]
  calf_r: [calf_r, RightLeg]
  foot_r: [foot_r, RightFoot]
  ball_r: [ball_r, RightToeBase]

# Mapeamento de clips: nome limpo de saída -> nome da action/track no pack source.
# Catálogo completo do UAL1 Standard (43 tracks; A_TPose é o bind pose de
# referência e fica de fora). Os nomes limpos são keywords que o jogo procura
# por substring (findClip/findClipFuzzy no VibeGame) — matches exatos ganham.
clip_map:
  # --- Locomoção ---
  idle: Idle_Loop
  walk: Walk_Loop
  walkformal: Walk_Formal_Loop
  run: Jog_Fwd_Loop
  sprint: Sprint_Loop
  crouchidle: Crouch_Idle_Loop
  crouchwalk: Crouch_Fwd_Loop
  swimidle: Swim_Idle_Loop
  swim: Swim_Fwd_Loop
  # --- Salto / queda ---
  jump: Jump_Start
  jumpland: Jump_Land
  # Jump_Loop é o pose airborne em ciclo — serve de "fall" para jogos
  # (o VibeGame procura 'fall' para o estado de queda).
  fall: Jump_Loop
  roll: Roll
  # --- Combate ---
  attack: Sword_Attack
  punch: Punch_Cross
  punchjab: Punch_Jab
  hit: Hit_Chest
  hithead: Hit_Head
  death: Death01
  # --- Arma de fogo ---
  pistolidle: Pistol_Idle_Loop
  aimdown: Pistol_Aim_Down
  aim: Pistol_Aim_Neutral
  aimup: Pistol_Aim_Up
  reload: Pistol_Reload
  shoot: Pistol_Shoot
  # --- Feitiço ---
  spellstart: Spell_Simple_Enter
  spellidle: Spell_Simple_Idle_Loop
  spellcast: Spell_Simple_Shoot
  spellend: Spell_Simple_Exit
  # --- Interação / social ---
  interact: Interact
  pickup: PickUp_Table
  fixing: Fixing_Kneeling
  push: Push_Loop
  talk: Idle_Talking_Loop
  torch: Idle_Torch_Loop
  dance: Dance_Loop
  roar: Dance_Loop
  drive: Driving_Loop
  # --- Sentar ---
  sitdown: Sitting_Enter
  sit: Sitting_Idle_Loop
  sittalk: Sitting_Talking_Loop
  situp: Sitting_Exit

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motion3d"
version = "0.2.0"
description = "CLI text-to-motion via SprongMotion-14M (CPU, C runtime) → NPZ / BVH / GLB (bpy)"
readme = "README.md"
authors = [{ name = "Motion3D Project" }]
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "numpy>=2.0.0",
    "huggingface_hub>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "rich-click>=1.8.0",
    # bpy 5.2 LTS — GLB armature export (export-glb / apply-rigged / generate -o *.glb)
    "bpy>=5.2.0",
    # Sem extra [gpu]: a inferência corre no runtime C (CPU). O torch deixou de
    # ser dependência directa ou transitiva desta tool.
    "aigamekit-shared[mesh] @ file:../Shared",
    # NÃO declarar irmãs via file: (ex. animator3d) — o uv copiaria o pacote para
    # dentro do venv e as edições locais deixavam de ser live.
    # O animator3d (import Python em apply_rigged) é gerido pelo instalador via
    # `_clified_animator3d.pth` → Animator3D/src (tools.yaml: cross_deps: [animator3d]).
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
motion3d = "motion3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Fontes C do runtime (Apache-2.0, vendor/sprongmotion). São compiladas para
# ~/.cache/aigamekit/sprongmotion/ no primeiro uso — não há binários no wheel.
[tool.setuptools.package-data]
motion3d = [
    "vendor/sprongmotion/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Grupo farm — alvos de recolha e identidade de quinta para o simple-farm.
#
# O pack existia como pasta vazia: `meshes/farm/` sem um único ficheiro e sem
# manifesto. Estes assets tapam os buracos que o mapa 512x512 expôs:
#   - não havia nenhum alvo de recolha de COMIDA (só madeira e pedra)
#   - não havia nada que dissesse "quinta" além de props de aldeia emprestados
#   - a floresta tinha 4 espécies e repetia-se à vista
#
# `category` + `size_m` bastam: o bbox_tune escolhe o octree a partir do
# char_m, e o soft-fill do Omni preenche control_type/presets por categoria.
# Não fixar `octree_resolution` aqui (ver docs/MANIFEST_AUTHORING.md §1).
#
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/farm
output_dir: ../public/assets
meshes_subdir: meshes/farm
images_subdir: images/farm
assets:
  # ── Alvos de recolha ────────────────────────────────────────────────
  - id: berry_bush
    seed: 51101
    idea:
      cartoon fantasy berry bush, round leafy green shrub heavy with clusters of
      ripe red berries, a few berries on the ground at the base, painterly
      storybook style, three quarter view, white background
    kind: environment
    category: vegetation
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.2, 1.0, 1.2]

  - id: ore_vein
    seed: 51107
    idea:
      cartoon fantasy ore vein boulder, grey rock with glinting copper and iron
      metal streaks running through the cracks, chunky faceted stone, a couple of
      loose nuggets at the foot, painterly storybook style, white background
    kind: environment
    category: terrain
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.6, 1.3, 1.5]

  - id: flint_rock
    seed: 51113
    idea: cartoon fantasy small flint stones, a low cluster of three sharp grey
      pebbles resting on the ground, chipped angular faces, painterly storybook
      style, white background
    kind: prop
    category: terrain
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [0.6, 0.3, 0.55]

  # ── Identidade de quinta ────────────────────────────────────────────

# Grupo vehicles — carroças de madeira (estáticos). Qualidade alinhada ao RPG:
# octree/steps/mc_level como hero (pinholes), bbox aniso como props Vale.
# size_m [X comprimento, Y altura, Z largura] — a malha nasce alongada em X;
# no jogo `model-yaw="90"` aponta o nariz para +Z. Regenerar:
# cd examples/shared-assets && gameassets resume --profile game.yaml --manifest manifests/vehicles
output_dir: ../public/assets
meshes_subdir: meshes/vehicles
images_subdir: images/vehicles
assets:
  - id: kart_hero
    seed: 55821
    generation: high
    idea:
      medieval wooden cart wagon sitting upright on four large wagon wheels on the
      ground plane, wheels down canopy up, oak plank cargo bed with iron corner bands,
      peaked red cloth canopy on four posts, empty no driver no rider no character,
      eye-level three-quarter view from front-right, solid base flush to ground, not
      lying on its side, not tipped over, not flattened, rustic Crystal Vale painterly,
      game-ready
    kind: vehicle
    category: vehicle
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    lod_levels: 1
    text3d:
      steps: 40
      octree_resolution: 320
      mc_level: 0
    omni:
      control_type: bbox
      size_m:
        - 2.4
        - 1.75
        - 1.15

# Grupo props-rpg — armas, ferramentas e itens de identidade RPG.
# Props genéricos partilhados (rock_mossy) estão em examples/shared-assets
# (manifests/props.yaml, symlink nesta pasta). Defs base em ../game.yaml.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/props-rpg
output_dir: ../public/assets
meshes_subdir: meshes/props
images_subdir: images/props
assets:
  - id: sword_hero
    seed: 44102
    idea:
      cartoon fantasy broadsword standing perfectly upright vertical on its pommel,
      tip pointing straight up, thin flat steel blade, golden crossguard, blue gem pommel
      at bottom on ground, front view, not tilted not diagonal not lying on side, hero
      weapon, clean simple design
    kind: prop
    category: weapon
    pipeline:
      - 3d
      - paint
      - collision
    omni:
      control_type: bbox
      size_m:
        - 0.12
        - 1.0
        - 0.04
  - id: axe
    seed: 77419
    idea:
      cartoon fantasy battle axe perfectly straight vertical like a plumb line,
      wooden handle butt on ground, steel axe head centered at very top, wide thin flat
      blade, leather wrap, orthographic front view, zero tilt zero lean, not diagonal
      not sideways, white background, hero weapon
    kind: prop
    category: weapon
    pipeline:
      - 3d
      - paint
      - collision
    omni:
      control_type: bbox
      size_m:
        - 0.35
        - 0.9
        - 0.05
  - id: spear
    idea:
      cartoon fantasy spear with thin leaf-shaped steel tip, long slender wooden
      shaft, leather grip, hero weapon, clean simple design, not a thick pole
    kind: prop
    category: weapon
    pipeline:
      - 3d
      - paint
      - collision
    omni:

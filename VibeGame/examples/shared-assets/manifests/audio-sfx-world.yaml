# Pack audio-sfx-world — interações com o mundo (portas/baús/fogo/passos) e
# física de itens (Stable Audio 3 Small SFX). Canónico em examples/shared-assets/.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/audio-sfx-world
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/player/hurt
    idea: Painful grunt, male warrior taking damage, sharp exhale of pain, short hurt vocalization
    kind: character
    # SEM category: "humanoid" mapeia para music_loop (modelo música) — o
    # perfil effects chega sozinho ao modelo SFX.
    pipeline:
      - audio
    audio:
      duration: 1
      profile: effects
    seed: 501
  - id: sfx/player/heal
    idea: Warm healing magic spell, gentle restoration chime, soft glowing energy swell, soothing recovery aura
    kind: character
    category: effects
    pipeline:
      - audio
    audio:
      duration: 2
      profile: effects
    seed: 505
  - id: sfx/world/item_drop
    idea: Item dropping on ground, object landing on stone floor, dull thud with bounce, inventory item fall
    kind: prop
    category: weapon
    pipeline:
      - audio
    audio:
      duration: 1
      profile: effects
    seed: 510
  - id: sfx/world/bomb_drop
    idea: Bomb fuse igniting, sizzling explosive timer, crackling fuse burn, tense countdown hiss
    kind: prop
    category: prop
    pipeline:
      - audio
    audio:
      duration: 1
      profile: effects
    seed: 511
  - id: sfx/world/door_open
    idea: Old wooden door opening with creak, slow hinge squeak, dungeon entrance
    kind: prop
    category: prop
    pipeline:
      - audio
    audio:
      duration: 1.5
      profile: effects
    seed: 521
  - id: sfx/world/door_close
    idea: Heavy wooden door slamming shut, solid thud with latch click
    kind: prop
    category: prop
    pipeline:
      - audio
    audio:
      duration: 1.2
      profile: effects
    seed: 522
  - id: sfx/world/chest_open
    idea: Treasure chest opening, wooden lid creak with golden sparkle reveal, rewarding discovery
    kind: prop
    category: prop
    pipeline:
      - audio
    audio:
      duration: 1.5
      profile: effects
    seed: 523
  - id: sfx/world/fire_crackle
    idea: Campfire crackling, warm wood fire popping and hissing, cozy flames
    kind: environment
    category: effects
    pipeline:
      - audio
    audio:
      duration: 4
      profile: effects
    seed: 524
  - id: sfx/world/footsteps_grass
    idea: Footsteps walking on grass, soft rhythmic steps on meadow ground, steady pace
    kind: character
    category: vegetation
    pipeline:
      - audio
    audio:
      duration: 3
      profile: effects
    seed: 525

# Pack audio-sfx-vehicles — motor/nitro/derrapagens/colisões
# (Stable Audio 3 Small SFX). Canónico em examples/shared-assets/.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/audio-sfx-vehicles
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/vehicles/crash
    idea: Kart crash impact, metal scrape and smash, car collision bang with debris rattle, short heavy crash
    kind: prop
    category: vehicle
    pipeline:
      - audio
    audio:
      duration: 2
      profile: effects
    seed: 304
  - id: sfx/vehicles/engine_rev
    idea: Arcade race car engine revving up, high revving kart motor roar, aggressive throttle blip, mechanical engine growl
    kind: prop
    category: vehicle
    pipeline:
      - audio
    audio:
      duration: 2.5
      profile: effects
    seed: 301
  - id: sfx/vehicles/nitro
    idea: Nitro boost activation whoosh, powerful rocket-like surge, jet burst hiss with rising pitch, turbo power up
    kind: prop
    category: vehicle
    pipeline:
      - audio
    audio:
      duration: 2
      profile: effects
    seed: 303
  - id: sfx/vehicles/skid
    idea: Tire skid squeal on asphalt, sharp rubber screech, kart drift brake sound, short sliding friction squeak
    kind: prop
    category: vehicle
    pipeline:
      - audio
    audio:
      duration: 1.5
      profile: effects
    seed: 302
  - id: sfx/vehicles/horn
    idea: Arcade car horn beep, cheerful double honk, playful kart horn
    kind: prop
    category: vehicle
    pipeline:
      - audio
    audio:
      duration: 0.8
      profile: effects
    seed: 414

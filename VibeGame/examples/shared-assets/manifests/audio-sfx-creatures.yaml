# Pack audio-sfx-creatures — vocalizações/ferimentos/mortes de criaturas
# (Stable Audio 3 Small SFX). Canónico em examples/shared-assets/.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/audio-sfx-creatures
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/creatures/enemy_hurt
    idea: Creature taking damage yelp, short monster pain cry, wounded beast whimper
    kind: character
    category: creature
    pipeline:
      - audio
    audio:
      duration: 0.8
      profile: effects
    seed: 502
  - id: sfx/creatures/enemy_death
    idea: Creature death wail, fading monster cry, dying beast collapse, long final groan
    kind: character
    category: creature
    pipeline:
      - audio
    audio:
      duration: 2
      profile: effects
    seed: 503
  - id: sfx/creatures/boss_roar
    idea: Massive boss monster roar, deep terrifying beast bellow, giant creature threatening growl, powerful boss entrance
    kind: character
    category: creature
    pipeline:
      - audio
    audio:
      duration: 3
      profile: effects
    seed: 504
  - id: sfx/creatures/slime_squish
    idea: Gelatinous slime squish and bounce, wet squelchy creature movement, playful blob wobble
    kind: character
    category: creature
    pipeline:
      - audio
    audio:
      duration: 1.2
      profile: effects
    seed: 514
  - id: sfx/creatures/wolf_growl
    idea: Wolf growl, low threatening canine snarl, wild predator warning rumble
    kind: character
    category: creature
    pipeline:
      - audio
    audio:
      duration: 1.5
      profile: effects
    seed: 515

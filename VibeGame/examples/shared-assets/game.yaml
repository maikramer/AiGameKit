title: Crystal Vale shared packs
genre: cartoon fantasy
tone: bright cheerful adventure, vibrant colors, playful cartoon world, Crystal Vale
style_preset: painterly
output_dir: ../../public/assets
path_layout: split
images_subdir: images
meshes_subdir: meshes
image_ext: png
seed_base: 7777
generation: medium

# Packs canónicos (forest / village / infra). O happy path de regen é
# `cd <exemplo>/sample-gameassets` — os YAML em manifests/ são symlinks para
# este directório, e `output_dir: ../../public/assets` resolve para o
# `public/assets` **desse** exemplo. Não correr o batch a partir daqui.
master_validate: true
master_bake_normals: false
negative_keywords:
  - gore
  - realistic
  - photorealistic
  - dark gritty
  - scary
text2d:
  width: 768
  height: 768
text3d:
  export_origin: feet
  bounds_mode: auto
  mc_level: auto
  split_at_height: true
  sdnq_preset: sdnq-int4
  memory_efficient: true
paint3d:
  preserve_origin: true
  texture_size: 2048

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeGame Simple Racer — Sunset Ridge</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1017;
        font-family: system-ui, Arial, sans-serif;
        color: #fff;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #101828, #0b0f18);
        z-index: 100;
        transition: opacity 0.35s ease-out;
      }
      #loading .title {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #loading .sub {
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        color: #7fd4ff;
        text-transform: uppercase;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading.ready {
        cursor: pointer;
      }
      #loading.ready .sub {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      .menu-buttons {
        display: flex;
        gap: 14px;
        margin-top: 18px;
      }
      .menu-buttons.cond-row {
        gap: 8px;
        margin-top: 10px;
      }
      .menu-buttons button {
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #fff;
        background: linear-gradient(150deg, rgba(56, 232, 255, 0.18), rgba(127, 93, 255, 0.22));
        border: 1px solid rgba(56, 232, 255, 0.5);
        border-radius: 10px;
        padding: 12px 22px;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .menu-buttons.cond-row button {
        font-size: 0.78rem;
        padding: 8px 14px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(14, 20, 32, 0.55);
      }
      .menu-buttons.cond-row button.selected {
        border-color: rgba(56, 232, 255, 0.7);
        box-shadow: 0 0 12px rgba(56, 232, 255, 0.25);
        color: #7fd4ff;
      }
      .menu-buttons button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 18px rgba(56, 232, 255, 0.35);
      }
      .menu-buttons.hidden {
        display: none;
      }
      .menu-buttons + .sub {
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <div class="title">Sunset Ridge</div>
      <div class="sub">Warming the tyres…</div>
      <div class="menu-buttons" id="mode-menu">
        <button data-mode="race">🏁 Race</button>
        <button data-mode="time-trial">⏱ Time Trial</button>
        <button data-mode="weekend">🏎 Weekend</button>
      </div>
      <div class="menu-buttons cond-row" id="cond-menu">
        <button data-condition="dry" class="selected">Dry</button>
        <button data-condition="wet">Wet</button>
        <button data-condition="night">Night</button>
        <button data-condition="storm">Storm</button>
      </div>
      <div
        class="sub"
        style="text-transform: none; letter-spacing: 0.04em; font-size: 0.78rem; color: #9ab"
      >
        Weekend = qualifying lap, then the race on that grid
      </div>
    </div>

    <Scene
      canvas="#game-canvas"
      sky="#2b1e3a"
      fog-color="#3a2a4a"
      fog-near="140"
      fog-far="900"
      ambient-intensity="0.75"
      resume-audio-on-user-gesture="true"
    >
      <!--
        O mundo vive em `public/world/*.xml`. Este ficheiro é só a casca:
        canvas, ecrã de arranque e a ordem dos Includes.

        (Um comentário XML não pode conter dois hífenes seguidos, por isso a
        tabela vai sem a linha de separação.)

        | Ficheiro                    | O que editar lá                        |
        | `world/environment.xml`     | céu, luz, pós-processamento, vento     |
        | `world/terrain.xml`         | heightmap, cores do terreno, lago      |
        | `world/circuit/bed.xml`     | terraplanagem: escapatória, berm, viaduto |
        | `world/circuit/track.xml`   | pista: largura, voltas, tema, pilares  |
        | `world/circuit/hazards.xml` | obstáculos e power-ups (coords de pista) |
        | `world/city/downtown.xml`   | os prédios da reta principal           |
        | `world/nature/forest.xml`   | floresta da bacia, pinhal da montanha  |
        | `world/grid.xml`            | jogador e rivais                       |
        | `world/hud.xml`             | câmara, música, HUD, menu de pausa     |

        O traçado em si está em `src/track.ts` — a lista de nós é injetada nos
        `<RaceTrack>` / `<Road>` acima por um hook de mundo (`GAME.onWorldXml`),
        que corre depois dos Includes e antes de existirem entidades.

        Ordem importa: terreno antes do circuito (o carve precisa do heightmap),
        circuito antes da vegetação (os spawners leem os corredores da estrada).
      -->
      <Include src="/world/environment.xml"></Include>
      <Include src="/world/terrain.xml"></Include>

      <Include src="/world/circuit/bed.xml"></Include>
      <Include src="/world/circuit/track.xml"></Include>
      <Include src="/world/circuit/hazards.xml"></Include>

      <Include src="/world/city/downtown.xml"></Include>
      <Include src="/world/nature/forest.xml"></Include>

      <Include src="/world/grid.xml"></Include>
      <Include src="/world/hud.xml"></Include>
    </Scene>

    <canvas id="game-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

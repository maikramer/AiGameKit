<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeGame Simple Racer — Sunset Ridge</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1017;
        font-family: system-ui, Arial, sans-serif;
        color: #fff;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #101828, #0b0f18);
        z-index: 100;
        transition: opacity 0.35s ease-out;
      }
      #loading .title {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #loading .sub {
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        color: #7fd4ff;
        text-transform: uppercase;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading.ready {
        cursor: pointer;
      }
      #loading.ready .sub {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      .menu-buttons {
        display: flex;
        gap: 14px;
        margin-top: 18px;
      }
      .menu-buttons button {
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #fff;
        background: linear-gradient(150deg, rgba(56, 232, 255, 0.18), rgba(127, 93, 255, 0.22));
        border: 1px solid rgba(56, 232, 255, 0.5);
        border-radius: 10px;
        padding: 12px 22px;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .menu-buttons button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 18px rgba(56, 232, 255, 0.35);
      }
      .menu-buttons.hidden {
        display: none;
      }
      .menu-buttons + .sub {
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <div class="title">Sunset Ridge</div>
      <div class="sub">Warming the tyres…</div>
      <div class="menu-buttons" id="mode-menu">
        <button data-mode="race">🏁 Race</button>
        <button data-mode="time-trial">⏱ Time Trial</button>
      </div>
    </div>

    <!--
      The circuit geometry is authored in src/track.ts and injected into
      <RaceTrack> by src/main.ts before the engine parses the scene (the node
      list is far too long to hand-write here, and keeping it in TypeScript
      means the prop dressing reads the same source).
    -->
    <Scene
      canvas="#game-canvas"
      sky="#2b1e3a"
      fog-color="#3a2a4a"
      fog-near="140"
      fog-far="900"
      ambient-intensity="0.75"
      resume-audio-on-user-gesture="true"
    >
      <!-- Céu equirect + IBL (mesmo pipeline do simple-rpg): o PMREM do
           equirect vira `scene.environment`, então os materiais PBR refletem
           o céu real em vez de uma sala neutra. -->
      <EquirectSky
        url="/assets/sky/sky.png"
        environment-intensity="0.5"
        background-intensity="1.0"
      ></EquirectSky>

      <!-- Luz + pós-processamento no MESMO GameObject (é assim que a entidade
           Postprocessing nasce — o runtime só parseia o innerHTML do Scene,
           um atributo `postprocessing=` no próprio <Scene> é ignorado).
           Sombras: PCSS soft (sem CSM — cascatas com materiais custom dão a
           sombra "quadrada"). SSAO ligado para a oclusão ambiente nos
           objetos. -->
      <GameObject
        ambient-light="sky-color: 0xffd9b0; ground-color: 0x2a2038; intensity: 0.7"
        directional-light="color: 0xff9a5c; intensity: 2.6; direction-x: -0.35; direction-y: 0.9; direction-z: -0.28; cast-shadow: 1; shadow-map-size: 2048; distance: 120; pcss: 0"
        postprocessing="enabled: 1; bloom: 1; bloom-strength: 0.5; bloom-radius: 0.6; bloom-threshold: 0.72; aa: smaa; tone-mapping: agx; tone-mapping-exposure: 1.12; vignette: 1; vignette-offset: 0.34; vignette-darkness: 0.4; color-grading: 1; saturation: 0.15; contrast: 0.07; ssao: 1; ssao-intensity: 1.1; ssao-radius: 0.1; film-grain: 0; chromatic-aberration: 0; god-rays: 0; depth-of-field: 0"
      >
      </GameObject>

      <!-- Vento global: empurra a grama (VegetationWindSystem lê
           getWindVector) e as nuvens do céu. -->
      <Weather
        wind="0.7 0.25"
        wind-strength="1.6"
        clouds="0.35"
        cloud-height="160"
        rain="0"
        cycle="1"
      ></Weather>

      <!-- Cenário fora do corredor (sistema de spawner do motor, mesmo padrão
           do simple-rpg): pinheiros e rochas nas colinas do terreno. O
           avoid-road usa o ground-brush kind:'road' que o <Road flatten>
           registra com o corredor real (leito + talude) — os spawners ficam
           fora do corte inteiro, sem buracos entre nós. -->
      <StaticSpawner
        count="300"
        seed="7101"
        region-min="-620 0 -620"
        region-max="620 0 620"
        align-to-terrain="1"
        ground-align="auto"
        max-slope-deg="35"
        scale-min="0.8"
        scale-max="1.5"
        avoid-road="1"
      >
        <GLTFLoader url="/assets/meshes/props/pine_tree_lod0.glb"></GLTFLoader>
      </StaticSpawner>
      <StaticSpawner
        count="80"
        seed="7102"
        region-min="-620 0 -620"
        region-max="620 0 620"
        align-to-terrain="1"
        ground-align="auto"
        max-slope-deg="40"
        scale-min="0.5"
        scale-max="1.2"
        avoid-road="1"
      >
        <GLTFLoader url="/assets/meshes/props/rock_boulder_lod0.glb"></GLTFLoader>
      </StaticSpawner>

      <!-- Grama com vento na beira da pista (mesmo padrão do simple-rpg). O
           spawner do motor assenta cada instância no terreno via heightfield;
           avoid-road mantém o corredor limpo usando o GroundBrush do Road. -->
      <Vegetation
        meshes="/assets/meshes/vegetation/grass.glb /assets/meshes/vegetation/grass_large.glb /assets/meshes/vegetation/flower_yellowA.glb /assets/meshes/vegetation/flower_redA.glb"
        density-per-km2="26000"
        seed="7"
        region-min="-640 0 -640"
        region-max="640 0 640"
        smart="0"
        cluster-count="0"
        cluster-radius="3.2"
        flower-near-radius="2.2"
        flower-density-ratio="0.22"
        plant-density-ratio="0.4"
        avoid-water="1"
        avoid-road="1"
        avoid-overlaps="0"
        wind="1"
        max-slope-deg="35"
        max-distance="160"
      ></Vegetation>

      <!-- Terreno com relevo derivado do circuito: o corredor da pista fica
           exatamente na elevação da pista (um pouco abaixo, para o leito
           assentar), e colinas suaves sobem para fora. O <Road flatten>
           abaixo afina o leito. TrackGround e TrackApron da pista são
           escondidos — o terreno faz o papel de chão e grama. -->
      <Terrain
        pos="0 0 0"
        world-size="1400"
        max-height="30"
        heightmap="/assets/terrain/heightmap.png"
        levels="4"
        resolution="64"
        collision-resolution="32"
        base-color="#4a6a2a"
        color-low="#3a5a22"
        color-mid="#557a35"
        color-high="#6a8a45"
      ></Terrain>

      <!-- Lago no infield: o carve do motor afunda a bacia e a waterline fica
           ~1m abaixo do nível da pista (que é suspensa pelo embankment), então
           a água nunca toca o asfalto. -->
      <Lake
        at="14 92"
        radius="11"
        depth="1.8"
        color="#2f7a9a"
      ></Lake>

      <!-- Leito da pista: carve agressivo (flatten) ao longo do circuito.
           O path é injetado por main.ts (vem do spline, como o centerline).
           Largura cobre pista + shoulders; falloff curto = corte de auto-
           estrada em vez de ombro suave. -->
      <Road
        id="circuit-bed"
        path="0 0 1 0"
        width="26"
        flatten="1"
        flatten-falloff="3"
        flatten-window="48"
        flatten-max-grade="0.3"
        texture-url=""

        edge-feather="0.6"
        edge-noise="0.3"
      ></Road>

      <!-- The circuit. `centerline`, `widths` and `sections` are filled in by
           main.ts; everything else is authored here. `theme="holo"` gives the
           track a neon grid + emissive rails; `checkpoint-count` arms the
           time-trial respawn system. -->
      <RaceTrack
        name="circuit"
        width="16"
        laps="3"
        closed="true"
        shoulder="3.5"
        walls="true"
        max-bank="9"
        theme="holo"
        checkpoint-count="8"
        road-color="#3b3e46"
        apron-color="#5c7f3c"
        shoulder-color="#9c8a63"
        wall-color="#e6e8ee"
        centerline="0 0 0 1 0 0 2 0 0"
      ></RaceTrack>

      <!-- Time-trial hazards + power-up orbs (track-space positions). -->
      <RaceTrackObstacle
        name="barrel-1"
        s="240"
        lateral="-1.5"
        radius="0.8"
        kind="barrel"
      ></RaceTrackObstacle>
      <RaceTrackObstacle
        name="drone-1"
        s="820"
        lateral="2"
        radius="1.0"
        kind="drone"
      ></RaceTrackObstacle>
      <RaceTrackObstacle
        name="gate-1"
        s="1290"
        lateral="0"
        radius="1.1"
        kind="gate"
      ></RaceTrackObstacle>
      <RaceTrackPickup s="95" lateral="0" kind="pulse" respawn="4"></RaceTrackPickup>
      <RaceTrackPickup s="540" lateral="-1" kind="sidewinder" respawn="5"></RaceTrackPickup>
      <RaceTrackPickup s="1010" lateral="1" kind="shield" respawn="5"></RaceTrackPickup>
      <RaceTrackPickup s="1470" lateral="-1" kind="pulse" respawn="4"></RaceTrackPickup>

      <!-- The player. Grid slots, orientation and ride height are owned by the
           race director; `pos` is irrelevant for a vehicle. -->
      <PlayerVehicle
        name="player"
        driver="You"
        color="#e03a3a"
        model-url="/assets/meshes/vehicles/kart_hero_lod0.glb"
        model-length="2.7"
        model-yaw="0"
        half-width="1.25"
        loadout="pulse:2,sidewinder:2,shield:1"
        max-speed="52"
        accel="27"
        brake="52"
        engine-brake="7"
        max-steer="2.7"
        steer-speed="11"
        grip="7.5"
        drift-grip="0.3"
        boost="2.6"
        boost-recharge="0.28"
      ></PlayerVehicle>

      <!-- Rivals (Race mode only — main.ts removes these for Time Trial).
           Same model as the player; each carries a power-up loadout and the AI
           collects orbs and fires slots like the player does. -->
      <AiVehicle
        name="rival-1"
        driver="Vega"
        color="#2f6fe0"
        model-url="/assets/meshes/vehicles/kart_rival_lod0.glb"
        model-length="2.7"
        model-yaw="180"
        half-width="1.25"
        loadout="pulse:2,sidewinder:2,shield:1"
        max-speed="52"
        accel="27"
        brake="52"
        skill="0.94"
        rubber-band="0.45"
        line-offset="0"
        boost="2.2"
      ></AiVehicle>
      <AiVehicle
        name="rival-2"
        driver="Koda"
        color="#f2a33c"
        model-url="/assets/meshes/vehicles/kart_rival_lod0.glb"
        model-length="2.7"
        model-yaw="180"
        half-width="1.25"
        loadout="pulse:1,sidewinder:2,shield:1"
        max-speed="51"
        accel="26"
        brake="50"
        skill="0.87"
        rubber-band="0.55"
        line-offset="1.4"
        boost="2.2"
      ></AiVehicle>
      <AiVehicle
        name="rival-3"
        driver="Mira"
        color="#59c98a"
        model-url="/assets/meshes/vehicles/kart_rival_lod0.glb"
        model-length="2.7"
        model-yaw="180"
        half-width="1.25"
        loadout="pulse:2,sidewinder:1,shield:2"
        max-speed="50"
        accel="26"
        brake="49"
        skill="0.8"
        rubber-band="0.6"
        line-offset="-1.4"
        boost="2.2"
      ></AiVehicle>
      <AiVehicle
        name="rival-4"
        driver="Rook"
        color="#b061e0"
        model-url="/assets/meshes/vehicles/kart_rival_lod0.glb"
        model-length="2.7"
        model-yaw="180"
        half-width="1.25"
        loadout="pulse:2,sidewinder:2,shield:2"
        max-speed="50"
        accel="25"
        brake="48"
        skill="0.74"
        rubber-band="0.65"
        line-offset="2.6"
        boost="2.2"
      ></AiVehicle>

      <ChaseCamera
        target="player"
        distance="7.6"
        height="3.1"
        follow-lag="0.1"
        turn-lag="0.15"
        look-ahead="5"
        fov="74"
        fov-boost="13"
      ></ChaseCamera>

      <!-- BGM layers driven by the engine MusicLayerDriver (main.ts):
           bgm-race while driving, crossfade to bgm-menu over the results. -->
      <MusicLayer layer="race" sound="bgm-race" base-volume="0.2"></MusicLayer>
      <MusicLayer layer="menu" sound="bgm-menu" base-volume="0.18"></MusicLayer>

      <HudScreenLayer>
        <HudWidget type="race-hud"></HudWidget>

        <!-- Setor à frente: mesma seta screen-space que o simple-rpg usa para
             as quests, aqui apontando o próximo checkpoint do circuito
             (CheckpointArrowSystem em main.ts). -->
        <WaypointArrow margin="64"></WaypointArrow>

        <!-- Pause menu (same TabbedModal widget as simple-rpg): [Q] opens,
             OptionsTab drives the music/sfx buses via wireOptions (main.ts). -->
        <TabbedModal
          id="pause"
          key="q"
          title-key="modal.pause"
        >
          <OptionsTab label-key="modal.tab.options">
            <OptionRow
              id="music-volume"
              type="slider"
              label-key="options.music"
              min="0"
              max="100"
              step="5"
              default="70"
            ></OptionRow>
            <OptionRow
              id="sfx-volume"
              type="slider"
              label-key="options.sfx"
              min="0"
              max="100"
              step="5"
              default="80"
            ></OptionRow>
            <OptionRow
              id="save"
              type="button"
              label-key="options.save"
            ></OptionRow>
            <OptionRow
              id="load"
              type="button"
              label-key="options.load"
            ></OptionRow>
            <OptionRow
              id="restart"
              type="button"
              label-key="options.restart"
            ></OptionRow>
            <OptionRow
              id="controls"
              type="note"
              label-key="options.controls"
            ></OptionRow>
          </OptionsTab>
        </TabbedModal>
      </HudScreenLayer>
    </Scene>

    <canvas id="game-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

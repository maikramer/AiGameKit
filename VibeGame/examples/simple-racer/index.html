<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeGame Simple Racer — Sunset Ridge</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1017;
        font-family: system-ui, Arial, sans-serif;
        color: #fff;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #101828, #0b0f18);
        z-index: 100;
        transition: opacity 0.35s ease-out;
      }
      #loading .title {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #loading .sub {
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        color: #7fd4ff;
        text-transform: uppercase;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading.ready {
        cursor: pointer;
      }
      #loading.ready .sub {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <div class="title">Sunset Ridge</div>
      <div class="sub">Warming the tyres…</div>
    </div>

    <!--
      The circuit geometry is authored in src/track.ts and injected into
      <RaceTrack> by src/main.ts before the engine parses the scene (the node
      list is far too long to hand-write here, and keeping it in TypeScript
      means the prop dressing reads the same source).
    -->
    <Scene
      canvas="#game-canvas"
      sky="#8fbde8"
      fog-color="#a8c6e0"
      fog-near="220"
      fog-far="1100"
      ambient-intensity="0.85"
      resume-audio-on-user-gesture="true"
      postprocessing="enabled: 1; bloom: 1; bloom-strength: 0.28; bloom-radius: 0.5; bloom-threshold: 0.85; aa: smaa; tone-mapping: agx; tone-mapping-exposure: 1.05; vignette: 1; vignette-offset: 0.45; vignette-darkness: 0.3; color-grading: 1; saturation: 0.1; contrast: 0.05"
    >
      <!-- The circuit. `centerline`, `widths` and `sections` are filled in by
           main.ts; everything else is authored here. -->
      <RaceTrack
        name="circuit"
        width="16"
        laps="3"
        closed="true"
        shoulder="3.5"
        walls="true"
        max-bank="9"
        road-color="#3b3e46"
        apron-color="#5c7f3c"
        shoulder-color="#9c8a63"
        wall-color="#e6e8ee"
        centerline="0 0 0 1 0 0 2 0 0"
      ></RaceTrack>

      <!-- The player. Grid slots, orientation and ride height are owned by the
           race director; `pos` is irrelevant for a vehicle. -->
      <PlayerVehicle
        name="hero"
        driver="You"
        color="#e03a3a"
        model-url="/assets/meshes/vehicles/kart_hero_lod0.glb"
        model-length="2.7"
        model-yaw="0"
        half-width="1.25"
        max-speed="52"
        accel="27"
        brake="52"
        engine-brake="7"
        max-steer="2.7"
        steer-speed="11"
        grip="7.5"
        drift-grip="0.3"
        boost="2.6"
        boost-recharge="0.28"
      ></PlayerVehicle>

      <!-- Rivals. Same vehicle model as the player; only `skill` and the line
           offset differ, so beating them is a matter of driving. -->
      <AiVehicle
        name="rival-1"
        driver="Vega"
        color="#2f6fe0"
        model-url="/assets/meshes/vehicles/kart_rival_lod0.glb"
        model-length="2.7"
        model-yaw="180"
        half-width="1.25"
        max-speed="52"
        accel="27"
        brake="52"
        skill="0.94"
        rubber-band="0.45"
        line-offset="0"
        boost="2.2"
      ></AiVehicle>
      <AiVehicle
        name="rival-2"
        driver="Koda"
        color="#f2a33c"
        model-url="/assets/meshes/vehicles/kart_rival_lod0.glb"
        model-length="2.7"
        model-yaw="180"
        half-width="1.25"
        max-speed="51"
        accel="26"
        brake="50"
        skill="0.87"
        rubber-band="0.55"
        line-offset="1.4"
        boost="2.2"
      ></AiVehicle>
      <AiVehicle
        name="rival-3"
        driver="Mira"
        color="#59c98a"
        model-url="/assets/meshes/vehicles/kart_rival_lod0.glb"
        model-length="2.7"
        model-yaw="180"
        half-width="1.25"
        max-speed="50"
        accel="26"
        brake="49"
        skill="0.8"
        rubber-band="0.6"
        line-offset="-1.4"
        boost="2.2"
      ></AiVehicle>
      <AiVehicle
        name="rival-4"
        driver="Rook"
        color="#b061e0"
        model-url="/assets/meshes/vehicles/kart_rival_lod0.glb"
        model-length="2.7"
        model-yaw="180"
        half-width="1.25"
        max-speed="50"
        accel="25"
        brake="48"
        skill="0.74"
        rubber-band="0.65"
        line-offset="2.6"
        boost="2.2"
      ></AiVehicle>

      <ChaseCamera
        target="hero"
        distance="7.6"
        height="3.1"
        follow-lag="0.1"
        turn-lag="0.15"
        look-ahead="5"
        fov="74"
        fov-boost="13"
      ></ChaseCamera>

      <HudScreenLayer>
        <HudWidget type="race-hud"></HudWidget>
      </HudScreenLayer>
    </Scene>

    <canvas id="game-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

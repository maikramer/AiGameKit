title: Simple Racer Demo
genre: cartoon fantasy cart racing
tone: bright cheerful adventure, vibrant colors, playful cartoon world, Crystal Vale
style_preset: painterly
output_dir: ../../public/assets
path_layout: split
images_subdir: images
meshes_subdir: meshes
image_ext: png
seed_base: 5555
generation: high

# Round 3 — master pipeline (default ON).
# DAG: topology-fix → bake-master → LOD → collision → promote (lod0=painted) → validate.
# Sem rig/animate: as carroças são estáticas — LOD0 = painted decimado.
master_validate: true
master_bake_normals: false
negative_keywords:
  - gore
  - realistic
  - photorealistic
  - dark gritty
  - scary
  - damaged
  - rusted
  - engine
  - spoiler
  - exhaust
text2d:
  width: 768
  height: 768
text3d:
  export_origin: feet
  # Decode Omni: bounds anisotrópicos + mc_level ∝ 1/octree (pinholes).
  bounds_mode: auto
  mc_level: auto
  split_at_height: false
  # Octree: omitido no perfil — override no manifest (vehicles: 320 + mc_level 0,
  # mesmo contrato do hero RPG). Autotune sozinho caiu em 160 e furou a malha.
  # Peak VRAM ~6 GB: uint8 recusa; int4 cabe.
  sdnq_preset: sdnq-int4
  memory_efficient: true
paint3d:
  preserve_origin: true
  texture_size: 2048
audio_subdir: audio
text2sound:
  quality: medium
  audio_format: ogg

# ============================================================
# ASSETS: em manifests/<grupo>.yaml — 1 manifesto por grupo.
#   gameassets resume --profile game.yaml --manifest manifests/vehicles
# forest / village / infra: symlinks → examples/shared-assets/manifests/
#   (copiar GLBs do RPG com shared-assets/sync-from-rpg.sh; GPU só nas carroças)
#   gameassets resume --profile game.yaml --manifest manifests/audio
# Cada grupo declara a própria pasta (output_dir / meshes_subdir / images_subdir).
# ============================================================

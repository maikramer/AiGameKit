assets:
  - id: shade
    idea:
      cartoon shadow shade creature, floating dark ghostly wraith with glowing purple eyes, tattered
      cloak, ethereal smoky body, standing upright in relaxed A-pose with arms angled down at 45 degrees away
      from the body, open hands with spread fingers, hands empty, no weapons, no props, full body visible,
      front-facing, fantasy undead spirit
    kind: character
    category: creature
    pipeline:
      - 3d
      - paint
      - rig
      - animate
      - lod
      - collision
    lod_levels: 1
    animate:
      preset: humanoid
      force_preset: true
      clips: idle,walk,run,jump,attack,hit,death
    omni:
      control_type: pose
      pose_preset: quaternius-apose
      size_m:
        - 0.6
        - 1.6
        - 0.4

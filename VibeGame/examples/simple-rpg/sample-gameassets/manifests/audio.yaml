# Grupo audio — BGM e SFX (Text2Sound).
# Defs base (estilo, ferramentas, presets) em ../game.yaml.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/audio
output_dir: ../../public/assets
assets:

- id: bgm_battle
  idea: intense fantasy battle music, driving orchestral combat theme, dramatic action
    rhythm
  kind: prop
  category: music
  pipeline:
  - audio
  generation: high
  audio:
    audio_preset: battle
- id: bgm_explore
  idea: peaceful fantasy village exploration music, gentle acoustic guitar and flute,
    warm ambient adventure melody, calm countryside
  kind: prop
  category: music
  pipeline:

# Grupo interiors — mobiliário e itens para ambientes internos.
# Igreja (capela), ferraria, casa comum, taverna, celeiro.
# Defs base (estilo, ferramentas, presets) em ../game.yaml.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/interiors
#
# REUSO de assets externos já gerados (ficam nos seus grupos; NÃO duplicar):
#   ferraria: anvil (village), weapon_rack (village), forge_bellows (village),
#             quench_trough (village), horseshoe_pile (village), log_pile (village)
#   casa/taverna: wooden_barrel (village), wooden_crate (village), wooden_bench (village),
#             chopping_block (village), iron_brazier (village), treasure_chest (village)
#   capela: stone_pillar (props), iron_brazier (village), wooden_bench (village)
# size_m [L,H,W] = [X,Y,Z] metros — docs/OMNI_SHAPE_FINDINGS.md §1

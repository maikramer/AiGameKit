# Pontes rio Discordia — 2 passagens (S: s_bank↔s_resume, W: w_bank↔w_resume).
# Rio: width=8 + bank 3.2×2 = carve 14.4 m; span 18 = +~1.8 m/lado; deck 3.6 (estrada 2).
# H baixa (~2.5): deck perto do chão + rampas nas cabeceiras (senão não se sobe).
# size_m [L,H,W]=span×altura×largura_deck. Placement: W yaw=0 (span∥X); S yaw=90 (span∥Z).
- id: river_bridge_wood
  idea: low wooden plank river bridge eighteen meters long, orthographic side profile,
    flat walkable deck about one meter above ground, gentle approach ramps on BOTH ends
    meeting the ground plane for walk-on access, continuous surface ground-ramp-deck-ramp-ground,
    four timber posts SYNMMETRIC two-by-two under midspan, low handrails, warm brown boards,
    freestanding, game-ready
  kind: environment
  category: building
  pipeline:
  - 3d
  - paint
  - lod
  - collision
  collision:
    mode: envelope
    max_faces: 256
    voxel_size: 0.1
    inflate: 0.08
  omni:
    control_type: bbox
    size_m:
    - 18.0
    - 2.5
    - 3.6

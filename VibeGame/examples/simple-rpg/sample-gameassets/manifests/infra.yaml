# Grupo infra — muralha, portão e pontes do rio Discordia.
# Defs base (estilo, ferramentas, presets) em ../game.yaml.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/infra
output_dir: ../../public/assets
meshes_subdir: meshes/infra
images_subdir: images/infra
assets:

- id: city_gate_arch
  # Collision: mode envelope (inflate+voxel) — especial p/ arcos côncavos c/ vão.
  # size L=10 encaixa vão ±5; H≈muro+merlons; W≈muro. Arco redondo + abutments prismáticos.
  idea: medieval stone city gate arch portal for tiling with curtain wall, classic round
    semicircular arched opening about eight meters wide between two pillars, left and
    right abutment pillars are constant-width rectangular stone prisms from ground to
    top with perfectly flat vertical outer side faces same thickness all the way up,
    no pedestal no plinth no flared base no wider footing no overhanging cornice no
    cantilever top corner no stepped buttress, straight outer profile flush for wall
    join, heavy stone arch voussoirs forming the round opening, simple square merlon
    battlements on top of lintel above the arch, warm grey stone blocks, no doors no
    portcullis, bottom flush with ground plane, front view game-ready prop
  kind: environment
  category: building
  pipeline:
  - 3d
  - paint
  - lod
  - collision
  collision:
    mode: envelope
    max_faces: 256
    voxel_size: 0.08
    inflate: 0.1
  omni:
    control_type: bbox
    size_m:
    - 10.0
    - 5.5
    - 1.2

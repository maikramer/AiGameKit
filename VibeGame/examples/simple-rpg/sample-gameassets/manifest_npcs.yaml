# Subconjunto: NPCs novos, modelados no npc_merchant (mesma pipeline,
# lod_levels, preset de animação e omni control_type=pose/quaternius-apose).
# O batch corre por manifest inteiro (não há --only), por isso os subsets
# vivem em ficheiros próprios — ver manifest_wolf_only.yaml e afins.
assets:
- id: npc_scout
  idea: lean cartoon scout NPC wearing hooded green cloak over leather jerkin, map case on belt, short
    boots, alert friendly expression, standing upright in relaxed A-pose with arms angled down at 45 degrees
    away from the body, visible gap between arms and torso, open hands with spread fingers, hands empty,
    no weapons, no props, full body visible, front-facing, fantasy ranger cartographer
  kind: character
  category: humanoid
  pipeline:
  - 3d
  - paint
  - rig
  - animate
  - lod
  - collision
  lod_levels: 1
  animate:
    preset: humanoid
    force_preset: true
    clips: idle,walk,run,jump,attack,hit,death
  omni:
    control_type: pose
    pose_preset: quaternius-apose
    size_m:
    - 0.6
    - 1.55
    - 0.45

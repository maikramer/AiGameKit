assets:
  - id: bandit
    idea:
      cartoon desert bandit with tan hood and face mask, leather armor scraps, dark
      eyes visible, standing upright in relaxed A-pose with arms angled down at 45 degrees
      away from the body, open hands with spread fingers, hands empty, no weapons, no
      props, full body visible, front-facing, fantasy rogue enemy, feet slightly apart
      clear gap between legs thighs separated no webbing
    kind: character
    category: creature
    pipeline:
      - 3d
      - paint
      - rig
      - animate
      - lod
      - collision
    lod_levels: 1
    animate:
      preset: humanoid
      force_preset: true
      clips: idle,walk,run,jump,attack,hit,death
    omni:
      control_type: pose
      pose_preset: quaternius-apose
      size_m:
        - 0.55
        - 1.65
        - 0.4

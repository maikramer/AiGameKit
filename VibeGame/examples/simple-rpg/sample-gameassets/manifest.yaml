assets:
- id: hero
  # Hero lab 2026-07-19 (text3d-only): dedos separados = octree 384 + mc_level 0.
  # O mc_level auto (-1/octree) engorda ~1 voxel (≈0.4 cm a 384) e funde o gap
  # ~1 cm entre dedos; 0 mantém os gaps. mc_level entra no fingerprint → regen auto.
  text3d:
    steps: 40
    octree_resolution: 384
    mc_level: 0
  # Round regen (hero lab): A-pose alinhada imagem↔esqueleto — run 5 mostrou as
  # melhores mãos com esqueleto A-pose (dedos naturais da imagem, sem ossos de dedos).
  idea: young cartoon fantasy adventurer wearing leather tunic with rolled-up sleeves, cloth bandana,
    simple belt with pouch, cheerful determined expression, short boots, no helmet no armor, standing
    upright in relaxed A-pose with arms angled down at 45 degrees away from the body, open hands with
    spread fingers, hands empty, no weapons, no props, full body visible, front-facing, RPG hero boy
  kind: character
  category: humanoid
  omni:
    control_type: pose
    pose_preset: quaternius-apose
    size_m:
    - 0.55
    - 1.55
    - 0.4
  pipeline:
  - 3d
  - paint
  - rig
  - animate
  - lod
  - collision
  lod_levels: 1
  animate:
    preset: humanoid
    force_preset: true
    clips: idle,walk,run,sprint,jump,attack,hit,death,sword,axe,spear,chop,swordidle,axeidle,spearidle,chopidle,mine,gather,interact,punch,roar,roll

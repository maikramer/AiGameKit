  idea: cute blue jelly slime as a wide squat SPHERE of goo sitting on the floor, like a water
    balloon or soft ball half-melted into a round mound, much wider than tall, two simple eyes and
    smile on the front of the ball, no cone no tower no pointed tip no hat brim no pedestal disk,
    no arms no legs no feet, pure round gelatin ball, white background

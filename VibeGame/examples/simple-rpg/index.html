<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple RPG Demo — Vale do Cristal (VibeGame)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: center center;
        will-change: transform;
      }

      #controls-hint {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        background: rgba(20, 15, 10, 0.55);
        border: 1px solid rgba(200, 160, 74, 0.35);
        border-radius: 4px;
        color: #e8d8b0;
        font: 12px Georgia, serif;
        letter-spacing: 0.5px;
        pointer-events: none;
        z-index: 50;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <!-- ==================================================================
         VALE DO CRISTAL — MAPA DO MUNDO
         ------------------------------------------------------------------

                              N (+Z) FLORESTA SOMBRIA
                              pinheiros · lobos · sombras
                              clareira da bruxa (chefe)
                                        │
         O (-X) PICOS GELADOS ──── CIDADE MURADA ──── L (+X) DESERTO
         rochedos · goblins          (muralha ±32)    cactos · escorpiões
         cristais · OGRO (final)                      ruínas · VERME
                                        │
                              S (-Z) PÂNTANO
                              salgueiros · boglings
                              choça · BOG WARDEN (chefe)

         ÍNDICE DA CENA
           §0  Céu, luz, pós-processamento, áudio
           §1  Biomas (4 cunhas cardeais)
           §2  Terreno + NavMesh
           §3  Herói
           §4  Cidade murada (muralha, praça, casas, mercado, props)
           §5  Anel do vale (recursos) + goblins de aviso
           §6  Norte  — Floresta Sombria
           §7  Leste  — Deserto
           §8  Sul    — Pântano
           §9  Oeste  — Picos Gelados
           §10 NPCs de quest (3 por bioma)
           §11 Câmera, HUD e UI
           §12 Group demo — agrupamento semântico aninhado (Town → sub-grupos)

         GRUPOS SEMÂNTICOS (<Group name="..."> — contentores na origem):
           environment       §0+§1  céu, luz, pós-proc, áudio, clima, biomas
           world-base        §2+§3  terreno (heightfield+NavMesh) + herói
           city              §4     cidade murada (sub-grupos: walls/plaza/roads/houses/…)
           valley-outskirts  §5     anel de recursos + goblins de aviso
           biome.forest      §6     Norte — Floresta Sombria
           biome.desert      §7     Leste — Deserto
           biome.swamp       §8     Sul — Pântano
           biome.peaks       §9     Oeste — Picos Gelados
           quest-npcs        §10    NPCs de quest + especiais (merchant/boss/chest)
           ui                §11    câmera, HUD, prompts, menu tabbed
           town              §12    DEMO — aldeia isolada (420,420) com sub-grupos

         INVARIANTE: todos os groups top-level ficam em pos="0 0 0" (identidade)
         para não deslocar o mundo. Mover um group desloca todos os filhos via
         hierarquia de transforms (Parent + TransformHierarchySystem). O Terrain
         faz merge no group "world-base" (recipe merge:true), que é também a
         entidade-terreno.

         CONTRATOS COM src/main.ts (não alterar sem sincronizar):
           · name="hero" / name="boss" / name="merchant"
           · SpawnExclusion at="0 0" radius="42" (espelha villageZones)
           · Portões cardeais na muralha ±32 (RESPAWN_POINTS usa ±39)
           · Banda de goblins do norte começa em z>=40 (segurança do respawn)
           · dialogue-id de cada NPC == id nos JSON em src/data/quests/
         ================================================================== -->
    <Scene
      canvas="#game-canvas"
      sky="#ffffff"
      resume-audio-on-user-gesture="true"
    >
      <!-- Projectile template used by ranged enemies (e.g. the archer). The
           archer script fires this via spawnProjectileFromTemplate. Visual is
           attached by main.ts's projectile watcher; the template only defines
           kinematics + damage + the 'enemy' faction so hero collision applies. -->
      <ProjectileTemplate
        id="enemy-arrow"
        speed="16"
        damage="8"
        max-life="2.5"
        sensor-radius="0.3"
        faction="enemy"
      ></ProjectileTemplate>
      <!-- ============================================================
           GRUPO "environment": céu, iluminação global, pós-processamento,
           áudio, clima e as 4 cunhas de bioma cardeais. Tudo aqui é global
           (luz ambiente/direcional, skybox, mixer, regiões de bioma) — não
           tem posicionar no mundo, pelo que o Group fica na origem (0 0 0)
           e funciona como contentor semântico. Movê-lo não é expectável,
           mas se algum dia for útil (e.g. skybox offset) todos os filhos
           acompanham via hierarquia de transforms.
           ============================================================ -->
      <Group name="environment" pos="0 0 0">
        <!-- ============================================================
           §0 CÉU, LUZ, PÓS-PROCESSAMENTO E ÁUDIO
           Pipeline moderado (stylized): sombras PCSS 1024, SSAO + bloom +
           fog/grading. DoF / god-rays / film-grain OFF (custo alto, pouco
           ganho em jogabilidade). SSR OFF (águas usam mirror planar).
           AdaptiveQuality pode baixar DPR até 0.75 sob pressão.
           ============================================================ -->
        <EquirectSky
          url="/assets/sky/sky.png"
          environment-intensity="0.45"
          background-intensity="1.4"
        ></EquirectSky>

        <!-- Sol baixo + ambient. Shadow 1024 + PCSS lean; CA off; SSAO
           half via AdaptiveQuality. CSM OFF (CustomShaderMaterial). -->
        <GameObject
          ambient-light="sky-color: 0xfff8f0; ground-color: 0xe0d0a8; intensity: 0.85"
          directional-light="color: 0xfff0d0; intensity: 3.2; direction-x: -0.9; direction-y: 1.2; direction-z: -0.5; cast-shadow: 0; shadow-map-size: 512; distance: 80; pcss: 0"
          postprocessing="enabled: 1; bloom: 1; bloom-strength: 0.12; bloom-radius: 0.40; bloom-threshold: 0.92; chromatic-aberration: 0; vignette: 1; vignette-offset: 0.34; vignette-darkness: 0.40; aa: fxaa; tone-mapping: agx; tone-mapping-exposure: 1.10; ssao: 0; ssao-intensity: 0.55; ssao-radius: 1.0; depth-of-field: 0; god-rays: 0; film-grain: 0; color-grading: 1; saturation: 0.06; contrast: 0.05; brightness: 0.015; height-fog: 1; fog-color: 0xc8d0d8; fog-density: 0.024; fog-height: 48; fog-falloff: 0.14"
        >
        </GameObject>

        <!-- Adaptive Quality: target 60; narrow DPR band to avoid tier flap. -->
        <AdaptiveQuality
          target-fps="60"
          min-pixel-ratio="0.55"
          max-pixel-ratio="0.75"
        ></AdaptiveQuality>

        <!-- Mixer + música em camadas (engine AudioPlugin). A camada explore
           toca por omissão; os biomas fazem crossfade via bgm-layer. -->
        <AudioMixer master="1" music="0.7" sfx="0.8"></AudioMixer>
        <MusicLayer
          url="/assets/audio/bgm_explore.ogg"
          layer="explore"
          base-volume="0.7"
          loop="1"
        ></MusicLayer>
        <MusicLayer
          url="/assets/audio/bgm_battle.ogg"
          layer="battle"
          base-volume="0.9"
          loop="1"
        ></MusicLayer>

        <!-- Clima global: vento constante de SW, nuvens com ciclo lento
           (cobertura "respira" ao longo de minutos), chuva controlada por
           bioma (pântano) ou via setWeather() em runtime. -->
        <Weather
          wind="0.7 0.25"
          wind-strength="1.5"
          clouds="0.5"
          cloud-height="150"
          rain="0"
          cycle="1"
        ></Weather>

        <!-- ============================================================
           §1 BIOMAS — 4 cunhas cardeais. O BiomeDetectionSystem aplica
           tint/fog/ambient/textura-de-terreno e crossfade de BGM quando
           o herói entra. type: 1=FLORESTA, 2=DESERTO, 3=PÂNTANO,
           4=MONTANHA. As cunhas começam fora do quadrado central (±28)
           e são partidas pelas diagonais (±240 nos cantos) — sem
           sobreposição; a cidade fica como vale neutro.
           ============================================================ -->
        <!-- NORTE: Floresta Sombria -->
        <BiomeRegion
          id="dark-forest"
          type="1"
          polygon="[-28,28;28,28;240,240;-240,240]"
          tint="#1a3320"
          fog-color="#16241c"
          fog-density="0.030"
          ambient="#3a4a55"
          bgm-layer="1"
          pp-exposure="0.8"
          pp-vignette-darkness="0.55"
          terrain-texture="/assets/textures/forest_floor.png"
        ></BiomeRegion>
        <!-- LESTE: Deserto -->
        <BiomeRegion
          id="desert"
          type="2"
          polygon="[28,-28;28,28;240,240;240,-240]"
          tint="#c2a878"
          fog-color="#d8c89a"
          fog-density="0.020"
          ambient="#5a4a3a"
          bgm-layer="1"
          pp-exposure="1.12"
          pp-bloom-strength="0.20"
          terrain-texture="/assets/textures/desert_sand.png"
        ></BiomeRegion>
        <!-- SUL: Pântano -->
        <BiomeRegion
          id="swamp"
          type="3"
          polygon="[-28,-28;28,-28;240,-240;-240,-240]"
          tint="#3a4a30"
          fog-color="#16241a"
          fog-density="0.034"
          ambient="#2a3a30"
          bgm-layer="1"
          rain="0.35"
          pp-exposure="0.9"
          terrain-texture="/assets/textures/swamp_mud.png"
        ></BiomeRegion>
        <!-- OESTE: Picos Gelados -->
        <BiomeRegion
          id="frozen-peaks"
          type="4"
          polygon="[-28,-28;-28,28;-240,240;-240,-240]"
          tint="#cdd9e6"
          fog-color="#dfe8f2"
          fog-density="0.024"
          ambient="#aeb9c8"
          bgm-layer="1"
          pp-exposure="1.05"
          terrain-texture="/assets/textures/snow_peak.png"
        ></BiomeRegion>
      </Group>
      <!-- FIM environment -->

      <!-- §3 HERÓI — nasce no centro da praça da cidade. Fora de qualquer
           <Group> porque <PlayerGLTF> é um recipe merge:true: se fosse child
           de um Group, o seu pos="0 40 0" fundir-se-ia no parent e elevaria
           o terreno inteiro (o terrain field lê o WorldTransform.posY da
           entidade onde faz merge). -->
      <PlayerGLTF
        name="hero"
        pos="0 40 0"
        model-url="/assets/meshes/hero_lod2.glb"
      >
      </PlayerGLTF>

      <!-- GRUPO "world-base": terreno (heightfield + NavMesh). O <Terrain>
           é merge:true, por isso funde neste Group e a entidade-Group torna-se
           a entidade-terreno (worldOffset lido do seu WorldTransform). Por
           isso o Group TEM de ficar em pos="0 0 0" — qualquer Y não-zero
           elevaria o heightfield global, os colliders e o sampling de altura
           usado por place=/align-to-terrain (cidade, pedras, etc.). NavMesh
           não é merge, fica como child próprio. -->
      <Group name="world-base" pos="0 0 0">
        <!-- ============================================================
           §2 TERRENO + NAVMESH
           Quadtree LOD chunks; world-size/max-height batem com
           public/assets/terrain/terrain.json. Física: uma heightfield
           Rapier por chunk visual, criada/libertada dinamicamente.
           ============================================================ -->
        <Terrain
          pos="0 0 0"
          world-size="2000"
          max-height="200"
          levels="4"
          resolution="64"
          collision-resolution="32"
          lod-hysteresis="1.3"
          lod-distance-ratio="2.4"
          height-smoothing="0.3"
          height-smoothing-spread="1.25"
          heightmap="/assets/terrain/heightmap.png"
          skirt-width="0.015625"
          roughness="0.82"
          metalness="0"
          normal-strength="2.6"
          base-color="#8cb866"
          texture="/assets/textures/vale_grass.png"
          ao-strength="0.9"
          height-blend-strength="0.40"
          snow-height="0.82"
          slope-threshold="0.58"
          slope-softness="0.14"
          color-low="#3a5a2a"
          color-mid="#8cb866"
          color-high="#e8f0ff"
          color-rock="#6a6660"
          noise-sand-strength="0.45"
          noise-sand-scale="0.012"
          noise-sand-threshold="0.56"
          noise-sand-height-min="0.02"
          noise-sand-height-max="0.50"
        ></Terrain>

        <NavMesh></NavMesh>
      </Group>
      <!-- FIM world-base -->

      <!-- GRUPO "city": cidade murada central. Sub-grupos semânticos
           (pos 0 0 0 — só organização; place=at continua em coords mundo):
             city.walls · city.plaza · city.roads · city.houses
             city.forge · city.barn · city.watch · city.chapel
             city.market · city.longhouse · city.landmarks
           Mover o Group raiz desloca a cidade inteira. -->
      <Group name="city" pos="0 0 0">
        <!-- ============================================================
           §4 CIDADE MURADA (VALE) — muralha ±32.
           Distritos: N sagrado/vigia · NW quinta · SW forja · SE mercado/ancião.
           Praça 16×16 no centro; vias cardeais + anel interno.
           Planeamento contido: pad suave + exclusion r≈42; recursos do vale
           ficam no anel ±36–58 (não espalhados até ±90).
           ============================================================ -->
        <SpawnExclusion at="0 0" radius="42"></SpawnExclusion>

        <!-- Pad de assentamento: cobre muralha ±32 com blend largo para o
           relevo natural (antes 104×104/falloff 10 → planalto artificial). -->
        <TerrainPad
          at="0 0"
          size="96 96"
          falloff="16"
          corner-radius="14"
        ></TerrainPad>

        <Group name="city.walls" pos="0 0 0">
          <!-- §4.1 Muralha quadrada ampliada (semi-lado 32, altura 3.5) com 4
           portões cardeais (vão de 8 m centrado em cada eixo) + ameias no
           topo + torres de canto reforçadas. collider=auto → bloqueia o
           jogador; os portões são a única passagem.
           Muros em pedra com texture-url mountain_stone para dar peso visual. -->
          <Composition
            place="at: 0 0; align-to-terrain: 0"
            body="fixed"
            collider="auto"
          >
            <!-- Norte (z=+32): 2 segmentos laterais ao vão central de 8 m.
               Torres de canto em ±32 (largura 1.8 → face interna ±31.1).
               Vão do portão: ±4. Cada segmento: de ±4 a ±31.1 = comprimento 27.1,
               centro ±17.55. Liga as torres ao vão sem sobrepor o portão. -->
            <Box
              pos="-17.55 1.0 32"
              size="27.1 5.0 0.7"
              color="#6a5236"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="7 2"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <Box
              pos="17.55 1.0 32"
              size="27.1 5.0 0.7"
              color="#6a5236"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="7 2"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <!-- Sul (z=-32) -->
            <Box
              pos="-17.55 1.0 -32"
              size="27.1 5.0 0.7"
              color="#6a5236"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="7 2"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <Box
              pos="17.55 1.0 -32"
              size="27.1 5.0 0.7"
              color="#6a5236"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="7 2"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <!-- Leste (x=+32) -->
            <Box
              pos="32 1.0 -17.55"
              size="0.7 5.0 27.1"
              color="#6a5236"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="2 7"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <Box
              pos="32 1.0 17.55"
              size="0.7 5.0 27.1"
              color="#6a5236"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="2 7"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <!-- Oeste (x=-32) -->
            <Box
              pos="-32 1.0 -17.55"
              size="0.7 5.0 27.1"
              color="#6a5236"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="2 7"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <Box
              pos="-32 1.0 17.55"
              size="0.7 5.0 27.1"
              color="#6a5236"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="2 7"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <!-- Ameias (merlons) no topo — 6 por segmento, espaçadas ~4.5 m.
               Posições x/z: ±7, ±11.5, ±16, ±20.5, ±25, ±29 (de ±4 a ±31.1) -->
            <!-- Norte: segmento esquerdo -->
            <Box pos="-29 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-25 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-20.5 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-16 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-11.5 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-7 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <!-- Norte: segmento direito -->
            <Box pos="7 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="11.5 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="16 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="20.5 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="25 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="29 3.85 32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <!-- Sul (z=-32) -->
            <Box pos="-29 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-25 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-20.5 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-16 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-11.5 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="-7 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="7 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="11.5 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="16 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="20.5 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="25 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <Box pos="29 3.85 -32" size="0.8 0.7 0.75" color="#5a4530"></Box>
            <!-- Leste (x=+32) -->
            <Box pos="32 3.85 -29" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 -25" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 -20.5" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 -16" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 -11.5" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 -7" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 7" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 11.5" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 16" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 20.5" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 25" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="32 3.85 29" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <!-- Oeste (x=-32) -->
            <Box pos="-32 3.85 -29" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 -25" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 -20.5" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 -16" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 -11.5" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 -7" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 7" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 11.5" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 16" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 20.5" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 25" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <Box pos="-32 3.85 29" size="0.75 0.7 0.8" color="#5a4530"></Box>
            <!-- Torres de canto (mais altas e largas que a muralha, com telhado cónico) -->
            <Box
              pos="32 1.65 32"
              size="1.8 6.3 1.8"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="2 3"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <Box
              pos="-32 1.65 32"
              size="1.8 6.3 1.8"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="2 3"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>
            <Box
              pos="32 1.65 -32"
              size="1.8 6.3 1.8"
              texture-url="/assets/textures/mountain_stone.png"
              texture-repeat="2 3"
              normal-map-url="/assets/textures/pbr_mountain_stone/mountain_stone_normal.png"
            ></Box>

      <!-- Câmera 3ª pessoa. Fora de qualquer <Group> porque
           <ThirdPersonCamera> é merge:true — dentro de um Group, a stack de
           câmera fundir-se-ia no parent em vez de criar a sua própria entidade.
           Teclas 1-6 alternam pós-processamento. -->
      <ThirdPersonCamera
        distance="3.3"
        height="1.55"
        pitch="0.32"
        fov="64"
        near="0.12"
        far="130"
        follow-lag="0.18"
        turn-lag="0.38"
        mouse-sensitivity="0.003"
      ></ThirdPersonCamera>

      <!-- GRUPO "ui": HUD (health/xp/bars/minimap/compass), prompts de
           diálogo, e o menu tabbed (pause/inventário/skills/opções/quests).
           Elementos DOM; o Group serve como contentor lógico. -->
      <Group name="ui" pos="0 0 0">
        <!-- ============================================================
           §11 CÂMERA, HUD E UI
           ============================================================ -->
        <PostFxDebugToggle></PostFxDebugToggle>

        <!-- HUD: camada declarativa screen-space + widgets (engine HudPlugin). -->
        <HudScreenLayer></HudScreenLayer>
        <HealthBar
          target-entity="hero"
          icon="/assets/icons/hud_health.png"
        ></HealthBar>
        <XpBar target-entity="hero"></XpBar>
        <ResourceChip
          resource="gold"
          icon="/assets/icons/hud_gold.png"
          target-entity="hero"
        ></ResourceChip>
        <ResourceChip
          resource="wood"
          icon="/assets/icons/hud_wood.png"
          target-entity="hero"
        ></ResourceChip>
        <ResourceChip
          resource="stone"
          icon="/assets/icons/hud_stone.png"
          target-entity="hero"
        ></ResourceChip>
        <Minimap range="60"></Minimap>
        <Compass></Compass>
        <TargetBar></TargetBar>
        <BossBar target-entity="boss"></BossBar>
        <InteractionPrompt
          key="F"
          range="4.5"
          position="bottom-center"
        ></InteractionPrompt>

        <!-- Diálogo (instância única). QuestTriggerSystem abre ao [F] perto
           de um <DialogueNPC>; QuestsTab lista as quests ativas. -->
        <DialogueBalloon></DialogueBalloon>

        <!-- Menu de pausa: modal tabbed com [Q]. -->
        <TabbedModal
          id="pause"
          key="q"
          target-entity="hero"
          title-key="modal.pause"
        >
          <InventoryTab columns="5"></InventoryTab>
          <SkillsTab></SkillsTab>
          <OptionsTab label-key="modal.tab.system">
            <OptionRow
              id="music-volume"
              type="slider"
              label-key="options.music"
              min="0"
              max="100"
              step="5"
              default="70"
            ></OptionRow>
            <OptionRow
              id="sfx-volume"
              type="slider"
              label-key="options.sfx"
              min="0"
              max="100"
              step="5"
              default="80"
            ></OptionRow>
            <OptionRow
              id="save"
              type="button"
              label-key="options.save"
            ></OptionRow>
            <OptionRow
              id="load"
              type="button"
              label-key="options.load"
            ></OptionRow>
            <OptionRow
              id="controls"
              type="note"
              label-key="options.controls"
            ></OptionRow>
          </OptionsTab>
          <WikiTab></WikiTab>
          <QuestsTab></QuestsTab>
        </TabbedModal>
      </Group>
      <!-- FIM ui -->

      <!-- ============================================================
           §12 GROUP DEMO — agrupamento semântico aninhado
           Um <Group> é um contentor com transform próprio: tudo o que está
           aninhado dentro (outros Groups, GameObjects, Compositions) fica
           pendurado na hierarquia de transforms (componente Parent). Mover o
           Group raiz (escrever o seu Transform e marcar dirty=1, por script ou
           tween) desloca TODOS os descendentes em conjunto — a engine compõe
           pai.WorldTransform × filho.Transform no mesmo frame.

           Aqui "town" é o contentor raiz; dentro há sub-grupos nomeados por
           prefixo (town.marketplace, town.bank, town.houses) cada um com os
           seus objetos. A nomenclatura hierárquica permite a uma LLM ou a
           código runtime ler a estrutura por prefixo
           (state.getNamedEntities() filtrado por "town.*").

           Posicionado longe da cidade principal (420, 420) para ser um demo
           isolado, sem interferir com o gameplay do §4. Os "edifícios" são
           <Composition><Box> leves (estáticos, sem texturas pesadas).
           ============================================================ -->
      <Group name="town" pos="420 0 420">
        <!-- Marketplace: banca + barraca do mercador -->
        <Group name="town.marketplace" pos="0 0 0">
          <GameObject name="town.merchant"></GameObject>
          <Composition place="at: 0 0" body="fixed">
            <Box pos="0 0.5 0" size="3 1 1.5" color="#8a5a2a"></Box>
            <Box pos="0 1.4 0" size="2.4 0.1 1.0" color="#5a3a18"></Box>
            <!-- Toldo da banca -->
            <Box pos="0 2.0 -0.6" size="3 0.1 2" color="#b03030"></Box>
            <Box pos="1.4 1.8 -0.6" size="0.12 0.6 0.12" color="#4a3020"></Box>
            <Box pos="-1.4 1.8 -0.6" size="0.12 0.6 0.12" color="#4a3020"></Box>
          </Composition>
        </Group>

        <!-- Banco: edifício + NPC banqueiro -->
        <Group name="town.bank" pos="14 0 -8">
          <GameObject name="town.banker"></GameObject>
          <Composition place="at: 0 0" body="fixed">
            <Box pos="0 1.2 0" size="4 2.4 3" color="#c8c0b0"></Box>
            <Box pos="0 2.7 0" size="4.4 0.2 3.4" color="#6a5a40"></Box>
            <!-- Colunas da fachada -->
            <Box pos="-1.7 1.2 1.6" size="0.3 2.4 0.3" color="#e0d8c8"></Box>
            <Box pos="1.7 1.2 1.6" size="0.3 2.4 0.3" color="#e0d8c8"></Box>
          </Composition>
        </Group>

        <!-- Casas: duas moradias agrupadas -->
        <Group name="town.houses" pos="-12 0 10">
          <Composition place="at: 0 0" body="fixed">
            <Box pos="0 1.2 0" size="3.5 2.4 3.5" color="#9a8a70"></Box>
            <Box pos="0 2.6 0" size="3.9 0.2 3.9" color="#5a4a3a"></Box>
          </Composition>
          <Composition place="at: 7 0" body="fixed">
            <Box pos="0 1.2 0" size="3.5 2.4 3.5" color="#7a8a70"></Box>
            <Box pos="0 2.6 0" size="3.9 0.2 3.9" color="#5a4a3a"></Box>
          </Composition>
        </Group>

        <!-- Poço central da aldeia (objeto directo no Group raiz) -->
        <Composition place="at: 5 5" body="fixed">
          <Box pos="0 0.4 0" size="2 0.8 2" color="#6a6a6a"></Box>
          <Box pos="0 1.4 0" size="0.15 1.2 0.15" color="#4a3020"></Box>
          <Box pos="0 1.9 0" size="1.8 0.12 1.8" color="#5a4a3a"></Box>
        </Composition>
      </Group>
    </Scene>

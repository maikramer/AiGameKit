<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple RPG Demo — Vale do Cristal (VibeGame)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: center center;
        will-change: transform;
      }

      #controls-hint {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        background: rgba(20, 15, 10, 0.55);
        border: 1px solid rgba(200, 160, 74, 0.35);
        border-radius: 4px;
        color: #e8d8b0;
        font: 12px Georgia, serif;
        letter-spacing: 0.5px;
        pointer-events: none;
        z-index: 50;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <!-- ==================================================================
         VALE DO CRISTAL — MAPA DO MUNDO
         ------------------------------------------------------------------

                    N (+Z) FLORESTA SOMBRIA  (colinas, 36→63 m)
                    pine_dark · lobos · sombras
                    posto avançado · menires · lenhador
                    clareira da bruxa (chefe)
                                   │
     O (-X) PICOS GELADOS ──── CIDADE MURADA ──── L (+X) DESERTO
     corredor 49 m entre         (muralha ±32)    dunas 36→57 m
     encostas de 130 m                            cactus · escorpiões
     mina · lago gelado                           arco · obelisco
     mojões · OGRO (final)                        caravana · VERME
                                   │
                    S (-Z) PÂNTANO  (bacia, 36→23 m)
                    dead_willow · boglings
                    cemitério · barca · altar de ossos
                    choça · BOG WARDEN (chefe)

         Diagonais = cristas (90 m a r=160, 165 m a r=300) que separam as
         cunhas; borda do mundo fecha a 200 m. frontier/ridges.xml veste-as.

         RELEVO — o heightmap do Terrain3D é praticamente plano na zona
         jogável, por isso é reesculpido offline por
         scripts/sculpt_terrain.py (vale central intocado, maciço a oeste
         com corredor até à arena, bacia a sul, dunas a leste, colinas a
         norte, cristas nas diagonais e serra na borda). O original fica em
         public/assets/terrain/heightmap.base.png; --restore repõe-o.

         GRUPOS SEMÂNTICOS (<Group name="..."> — contentores na origem):
           environment              céu, luz, pós-proc, áudio, clima, biomas
           world-base               terreno (heightfield+NavMesh)
           city                     cidade murada (walls/plaza/roads/houses/…)
           valley-outskirts         anel de recursos + goblins de aviso
           paths.trails             trilhos dos biomas (cardeais + ramos)
           biome.<b>.vegetation     tapete, dossel, rochas por bioma
           biome.<b>.landmarks      destinos: postos, ruínas, minas, arena
           frontier.ridges          cristas diagonais entre cunhas
           creatures                inimigos por bioma
           creatures.bosses         4 chefes (name="boss" = final, BossBar)
           quest-npcs               NPCs de quest + especiais (merchant/chest)
           atmosphere.ambient       partículas de ambiente
           ui                       câmera, HUD, prompts, menu tabbed
           town                     DEMO — aldeia isolada (420,420)

         INVARIANTE: todos os groups top-level ficam em pos="0 0 0" (identidade)
         para não deslocar o mundo. Mover um group desloca todos os filhos via
         hierarquia de transforms (Parent + TransformHierarchySystem). O Terrain
         faz merge no group "world-base" (recipe merge:true), que é também a
         entidade-terreno.


         MAPAS MODULARES (public/world/ — ver context.md lá):
           environment.xml · cities/discordia.xml · cities/town-demo.xml
           spawn/ring.xml · paths/network.xml · paths/trails.xml · frontier/ridges.xml
           vegetation/{forest,desert,swamp,peaks}.xml
           landmarks/{forest,desert,swamp,peaks}.xml
           creatures/enemies.xml · creatures/bosses.xml · ai/npcs.xml
           atmosphere/ambient-fx.xml
           Editar o XML do domínio — index.html é só shell + Includes.

         CONTRATOS COM src/main.ts (não alterar sem sincronizar):
           · name="hero" / name="boss" / name="merchant"
           · SpawnExclusion at="0 0" radius="84" (espelha villageZones)
           · Portões cardeais na muralha ±64 (RESPAWN_POINTS usa ±78)
           · Banda de goblins do norte começa em z>=80 (segurança do respawn)
           · dialogue-id de cada NPC == id nos JSON em src/data/quests/
         ================================================================== -->
    <Scene
      canvas="#game-canvas"
      sky="#8fc2ef"
      resume-audio-on-user-gesture="true"
    >
      <!-- Projectile template used by ranged enemies (e.g. the archer). The
           archer script fires this via spawnProjectileFromTemplate. Visual is
           attached by main.ts's projectile watcher; the template only defines
           kinematics + damage + the 'enemy' faction so hero collision applies. -->
      <ProjectileTemplate
        id="enemy-arrow"
        speed="16"
        damage="8"
        max-life="2.5"
        sensor-radius="0.3"
        faction="enemy"
      ></ProjectileTemplate>
      <!-- ============================================================
           GRUPO "environment": céu, iluminação global, pós-processamento,
           áudio, clima e as 4 cunhas de bioma cardeais. Tudo aqui é global
           (luz ambiente/direcional, skybox, mixer, regiões de bioma) — não
           tem posicionar no mundo, pelo que o Group fica na origem (0 0 0)
           e funciona como contentor semântico. Movê-lo não é expectável,
           mas se algum dia for útil (e.g. skybox offset) todos os filhos
           acompanham via hierarquia de transforms.
           ============================================================ -->
      <Include src="/world/environment.xml"></Include>

      <!-- §3 HERÓI — nasce no centro da praça da cidade. Fora de qualquer
           <Group> porque <PlayerGLTF> é um recipe merge:true: se fosse child
           de um Group, o seu pos="0 40 0" fundir-se-ia no parent e elevaria
           o terreno inteiro (o terrain field lê o WorldTransform.posY da
           entidade onde faz merge). -->
      <PlayerGLTF
        name="hero"
        pos="0 40 0"
        model-url="/assets/meshes/hero_lod0.glb"
      >
      </PlayerGLTF>
      <!-- Hold hero until heightmap + heightfield ready, then seat once (CCT). -->
      <SpawnGate target-entity="hero" y-fallback="40"></SpawnGate>

      <!-- GRUPO "world-base": terreno (heightfield + NavMesh). O <Terrain>
           é merge:true — o Group TEM de ficar em pos="0 0 0". -->
      <Group name="world-base" pos="0 0 0">
        <!-- ============================================================
           §2 TERRENO + NAVMESH
           Quadtree LOD chunks; world-size/max-height batem com
           public/assets/terrain/terrain.json. Física: uma heightfield
           Rapier por chunk visual, criada/libertada dinamicamente.
           ============================================================ -->
        <Terrain
          pos="0 0 0"
          world-size="4000"
          max-height="200"
          levels="4"
          resolution="64"
          collision-resolution="32"
          lod-hysteresis="1.3"
          lod-distance-ratio="2.4"
          height-smoothing="0.3"
          height-smoothing-spread="1.25"
          heightmap="/assets/terrain/heightmap.png"
          skirt-width="0.015625"
          roughness="0.82"
          metalness="0"
          normal-strength="2.6"
          base-color="#8cb866"
          texture="/assets/textures/vale_grass.png"
          ao-strength="0.9"
          height-blend-strength="0.40"
          snow-height="0.50"
          slope-threshold="0.78"
          slope-softness="0.10"
          color-low="#3a5a2a"
          color-mid="#8cb866"
          color-high="#e8f0ff"
          color-rock="#6a6660"
          noise-sand-strength="0.45"
          noise-sand-scale="0.012"
          noise-sand-threshold="0.56"
          noise-sand-height-min="0.02"
          noise-sand-height-max="0.50"
        ></Terrain>

        <NavMesh></NavMesh>
      </Group>
      <!-- FIM world-base -->

      <Include src="/world/cities/discordia.xml"></Include>
      <Include src="/world/spawn/ring.xml"></Include>
      <Include src="/world/paths/network.xml"></Include>
      <Include src="/world/paths/trails.xml"></Include>

      <!-- Biomas: vegetação (tapete + dossel) e landmarks (destinos) em
           ficheiros separados por cunha cardeal. -->
      <Include src="/world/vegetation/forest.xml"></Include>
      <Include src="/world/vegetation/desert.xml"></Include>
      <Include src="/world/vegetation/swamp.xml"></Include>
      <Include src="/world/vegetation/peaks.xml"></Include>
      <Include src="/world/landmarks/forest.xml"></Include>
      <Include src="/world/landmarks/desert.xml"></Include>
      <Include src="/world/landmarks/swamp.xml"></Include>
      <Include src="/world/landmarks/peaks.xml"></Include>

      <Include src="/world/frontier/ridges.xml"></Include>
      <Include src="/world/atmosphere/ambient-fx.xml"></Include>
      <Include src="/world/creatures/enemies.xml"></Include>
      <Include src="/world/creatures/bosses.xml"></Include>
      <Include src="/world/ai/npcs.xml"></Include>

      <!-- Câmera 3ª pessoa. Fora de qualquer <Group> porque
           <ThirdPersonCamera> é merge:true — dentro de um Group, a stack de
           câmera fundir-se-ia no parent em vez de criar a sua própria entidade.
           Teclas 1-6 alternam pós-processamento. -->
      <ThirdPersonCamera
        distance="3.3"
        height="1.55"
        pitch="0.32"
        fov="64"
        near="0.12"
        far="840"
        follow-lag="0.18"
        turn-lag="0.38"
        mouse-sensitivity="0.003"
      ></ThirdPersonCamera>

      <!-- GRUPO "ui": HUD (health/xp/bars/minimap/compass), prompts de
           diálogo, e o menu tabbed (pause/inventário/skills/opções/quests).
           Elementos DOM; o Group serve como contentor lógico. -->
      <Group name="ui" pos="0 0 0">
        <!-- ============================================================
           §11 CÂMERA, HUD E UI
           ============================================================ -->
        <PostFxDebugToggle></PostFxDebugToggle>

        <!-- HUD: camada declarativa screen-space + widgets (engine HudPlugin). -->
        <HudScreenLayer></HudScreenLayer>
        <HealthBar
          target-entity="hero"
          icon="/assets/icons/hud_health.png"
        ></HealthBar>
        <XpBar target-entity="hero"></XpBar>
        <ResourceChip
          resource="gold"
          icon="/assets/icons/hud_gold.png"
          target-entity="hero"
        ></ResourceChip>
        <ResourceChip
          resource="wood"
          icon="/assets/icons/hud_wood.png"
          target-entity="hero"
        ></ResourceChip>
        <ResourceChip
          resource="stone"
          icon="/assets/icons/hud_stone.png"
          target-entity="hero"
        ></ResourceChip>
        <Minimap range="60"></Minimap>
        <Compass></Compass>
        <TargetBar></TargetBar>
        <BossBar target-entity="boss"></BossBar>
        <InteractionPrompt
          key="F"
          range="4.5"
          position="bottom-center"
        ></InteractionPrompt>

        <!-- Navegação de missão: seta screen-space para o marcador rastreado
           (fora do ecrã encosta à borda e aponta) + canto com as missões
           ativas. Os pontos no minimapa/bússola vêm do mesmo registo de
           waypoints (QuestBeaconSystem). -->
        <WaypointArrow margin="64"></WaypointArrow>
        <QuestTracker anchor="top-right" max-rows="4"></QuestTracker>

        <!-- Diálogo (instância única). QuestTriggerSystem abre ao [F] perto
           de um <DialogueNPC>; QuestsTab lista as quests ativas. -->
        <DialogueBalloon></DialogueBalloon>

        <!-- Menu de pausa: modal tabbed com [Q]. -->
        <TabbedModal
          id="pause"
          key="q"
          target-entity="hero"
          title-key="modal.pause"
        >
          <InventoryTab columns="5"></InventoryTab>
          <SkillsTab></SkillsTab>
          <OptionsTab label-key="modal.tab.system">
            <OptionRow
              id="music-volume"
              type="slider"
              label-key="options.music"
              min="0"
              max="100"
              step="5"
              default="70"
            ></OptionRow>
            <OptionRow
              id="sfx-volume"
              type="slider"
              label-key="options.sfx"
              min="0"
              max="100"
              step="5"
              default="80"
            ></OptionRow>
            <OptionRow
              id="save"
              type="button"
              label-key="options.save"
            ></OptionRow>
            <OptionRow
              id="load"
              type="button"
              label-key="options.load"
            ></OptionRow>
            <OptionRow
              id="controls"
              type="note"
              label-key="options.controls"
            ></OptionRow>
          </OptionsTab>
          <WikiTab></WikiTab>
          <QuestsTab></QuestsTab>
        </TabbedModal>
      </Group>
      <!-- FIM ui -->

      <Include src="/world/cities/town-demo.xml"></Include>
    </Scene>

    <canvas id="game-canvas"></canvas>
    <div id="controls-hint">
      WASD mover · Espaço pular · J atacar · F interagir · K comércio · B bomba
      · Q menu · P profiler (?profiler=1)
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

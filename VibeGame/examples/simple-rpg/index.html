<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple RPG Demo — Vale do Cristal (VibeGame)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: center center;
        will-change: transform;
      }

      #controls-hint {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        background: rgba(20, 15, 10, 0.55);
        border: 1px solid rgba(200, 160, 74, 0.35);
        border-radius: 4px;
        color: #e8d8b0;
        font: 12px Georgia, serif;
        letter-spacing: 0.5px;
        pointer-events: none;
        z-index: 50;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <!-- ==================================================================
         VALE DO CRISTAL — MAPA DO MUNDO
         ------------------------------------------------------------------

                              N (+Z) FLORESTA SOMBRIA
                              pinheiros · lobos · sombras
                              clareira da bruxa (chefe)
                                        │
         O (-X) PICOS GELADOS ──── CIDADE MURADA ──── L (+X) DESERTO
         rochedos · goblins          (vale, ±22)      cactos · escorpiões
         cristais · OGRO (final)                      ruínas · VERME
                                        │
                              S (-Z) PÂNTANO
                              salgueiros · boglings
                              choça · BOG WARDEN (chefe)

         ÍNDICE DA CENA
           §0  Céu, luz, pós-processamento, áudio
           §1  Biomas (4 cunhas cardeais)
           §2  Terreno + NavMesh
           §3  Herói
           §4  Cidade murada (muralha, praça, casas, mercado, props)
           §5  Anel do vale (recursos) + goblins de aviso
           §6  Norte  — Floresta Sombria
           §7  Leste  — Deserto
           §8  Sul    — Pântano
           §9  Oeste  — Picos Gelados
           §10 NPCs de quest (3 por bioma)
           §11 Câmera, HUD e UI

         CONTRATOS COM src/main.ts (não alterar sem sincronizar):
           · name="hero" / name="boss" / name="merchant"
           · SpawnExclusion at="0 0" radius="30" (espelha villageZones)
           · Portões cardeais na muralha ±22 (RESPAWN_POINTS usa ±28)
           · Banda de goblins do norte começa em z>=40 (segurança do respawn)
           · dialogue-id de cada NPC == id nos JSON em src/data/quests/
         ================================================================== -->
    <Scene
      canvas="#game-canvas"
      sky="#ffffff"
      resume-audio-on-user-gesture="true"
    >
      <!-- ============================================================
           §0 CÉU, LUZ, PÓS-PROCESSAMENTO E ÁUDIO
           Pipeline de realismo pesado (cinematic stylized): sombras PCSS
           com penumbra real, god rays volumétricos através das árvores,
           DoF cinematográfico no herói, grão de filme + color grading
           quente, IBL reforçado. SSR (engine) existe e é seletivo — só
           meshes shiny (metalness>=0.5+roughness<=0.4, roughness<=0.15
           ou userData.ssrReflective) refletem — mas fica OFF aqui: neste
           mapa só as águas qualificam e o ganho visual não paga o custo
           (re-render da cena em 3 passes internos do SSRPass).
           Trade-off: performance (esperado <60 FPS em GPU média).
           ============================================================ -->
      <EquirectSky
        url="/assets/sky/sky.png"
        environment-intensity="0.45"
        background-intensity="1.4"
      ></EquirectSky>

      <!-- Sol mais baixo (~50° em vez de ~80°) + ambient reduzido = sombras
           realmente visíveis e contraste 3D. PCSS liga penumbra variável
           (duro no contacto, suave longe) no frustum único de 4096.
           CSM fica OFF neste mapa: o CSM.js precisa de patch por material
           para clipar cascatas, e o terreno/água usam CustomShaderMaterial
           (não patchável — setupCsmMaterial pula de propósito). Com 4
           cascatas o chão recebia 4x a luz (wash-out) e ficava SEM sombra.
           Frustum único + PCSS dá a penumbra cinemática sem quebrar a
           iluminação. -->
      <GameObject
        ambient-light="sky-color: 0xfff8f0; ground-color: 0xe0d0a8; intensity: 0.85"
        directional-light="color: 0xfff0d0; intensity: 3.2; direction-x: -0.9; direction-y: 1.2; direction-z: -0.5; cast-shadow: 1; shadow-map-size: 4096; distance: 120; pcss: 1"
        postprocessing="enabled: 1; bloom: 1; bloom-strength: 0.25; bloom-radius: 0.5; bloom-threshold: 0.85; chromatic-aberration: 1; ca-strength: 0.0006; vignette: 1; vignette-offset: 0.30; vignette-darkness: 0.55; aa: smaa; tone-mapping: agx; tone-mapping-exposure: 1.15; ssao: 1; ssao-intensity: 1.2; ssao-radius: 1.5; depth-of-field: 1; dof-focus-distance: 0.02; dof-focus-range: 0.3; dof-bokeh-scale: 2.2; god-rays: 1; god-rays-density: 0.96; god-rays-decay: 0.92; god-rays-weight: 0.35; god-rays-exposure: 0.6; film-grain: 1; film-grain-opacity: 0.06; color-grading: 1; saturation: 0.12; contrast: 0.10; brightness: 0.02; height-fog: 1; fog-color: 0xc8d0d8; fog-density: 0.012; fog-height: 40; fog-falloff: 0.10"
      >
      </GameObject>

      <!-- Mixer + música em camadas (engine AudioPlugin). A camada explore
           toca por omissão; os biomas fazem crossfade via bgm-layer. -->
      <AudioMixer master="1" music="0.7" sfx="0.8"></AudioMixer>
      <MusicLayer
        url="/assets/audio/bgm_explore.ogg"
        layer="explore"
        base-volume="0.7"
        loop="1"
      ></MusicLayer>
      <MusicLayer
        url="/assets/audio/bgm_battle.ogg"
        layer="battle"
        base-volume="0.9"
        loop="1"
      ></MusicLayer>

      <!-- Clima global: vento constante de SW, nuvens com ciclo lento
           (cobertura "respira" ao longo de minutos), chuva controlada por
           bioma (pântano) ou via setWeather() em runtime. -->
      <Weather
        wind="0.7 0.25"
        wind-strength="1.5"
        clouds="0.5"
        cloud-height="150"
        rain="0"
        cycle="1"
      ></Weather>

      <!-- ============================================================
           §1 BIOMAS — 4 cunhas cardeais. O BiomeDetectionSystem aplica
           tint/fog/ambient/textura-de-terreno e crossfade de BGM quando
           o herói entra. type: 1=FLORESTA, 2=DESERTO, 3=PÂNTANO,
           4=MONTANHA. As cunhas começam fora do quadrado central (±28)
           e são partidas pelas diagonais (±240 nos cantos) — sem
           sobreposição; a cidade fica como vale neutro.
           ============================================================ -->
      <!-- NORTE: Floresta Sombria -->
      <BiomeRegion
        id="dark-forest"
        type="1"
        polygon="[-28,28;28,28;240,240;-240,240]"
        tint="#1a3320"
        fog-color="#16241c"
        fog-density="0.020"
        ambient="#3a4a55"
        bgm-layer="1"
        pp-exposure="0.8"
        pp-vignette-darkness="0.8"
        terrain-texture="/assets/textures/forest_floor.png"
      ></BiomeRegion>
      <!-- LESTE: Deserto -->
      <BiomeRegion
        id="desert"
        type="2"
        polygon="[28,-28;28,28;240,240;240,-240]"
        tint="#c2a878"
        fog-color="#d8c89a"
        fog-density="0.010"
        ambient="#5a4a3a"
        bgm-layer="1"
        pp-exposure="1.12"
        pp-bloom-strength="0.35"
        terrain-texture="/assets/textures/desert_sand.png"
      ></BiomeRegion>
      <!-- SUL: Pântano -->
      <BiomeRegion
        id="swamp"
        type="3"
        polygon="[-28,-28;28,-28;240,-240;-240,-240]"
        tint="#3a4a30"
        fog-color="#16241a"
        fog-density="0.028"
        ambient="#2a3a30"
        bgm-layer="1"
        rain="0.55"
        pp-exposure="0.9"
        terrain-texture="/assets/textures/swamp_mud.png"
      ></BiomeRegion>
      <!-- OESTE: Picos Gelados -->
      <BiomeRegion
        id="frozen-peaks"
        type="4"
        polygon="[-28,-28;-28,28;-240,240;-240,-240]"
        tint="#cdd9e6"
        fog-color="#dfe8f2"
        fog-density="0.012"
        ambient="#aeb9c8"
        bgm-layer="1"
        pp-exposure="1.05"
        terrain-texture="/assets/textures/snow_peak.png"
      ></BiomeRegion>

      <!-- ============================================================
           §2 TERRENO + NAVMESH
           Quadtree LOD chunks; world-size/max-height batem com
           public/assets/terrain/terrain.json. Física: uma heightfield
           Rapier por chunk visual, criada/libertada dinamicamente.
           ============================================================ -->
      <Terrain
        pos="0 0 0"
        world-size="2000"
        max-height="200"
        levels="4"
        resolution="128"
        lod-hysteresis="1.3"
        lod-distance-ratio="2"
        height-smoothing="0.3"
        height-smoothing-spread="1.25"
        heightmap="/assets/terrain/heightmap.png"
        skirt-width="0.015625"
        roughness="0.82"
        metalness="0"
        normal-strength="2.6"
        base-color="#8cb866"
        texture="/assets/textures/vale_grass.png"
        ao-strength="0.9"
        height-blend-strength="0.40"
        snow-height="0.82"
        slope-threshold="0.58"
        slope-softness="0.14"
        color-low="#3a5a2a"
        color-mid="#8cb866"
        color-high="#e8f0ff"
        color-rock="#6a6660"
      ></Terrain>

      <NavMesh></NavMesh>

      <!-- ============================================================
           §3 HERÓI — nasce no centro da praça da cidade.
           ============================================================ -->
      <PlayerGLTF
        name="hero"
        pos="0 40 0"
        model-url="/assets/meshes/hero_rigged_animated.glb"
      >
      </PlayerGLTF>

      <!-- ============================================================
           §4 CIDADE MURADA (VALE) — |x|,|z| ≲ 22.
           A exclusão impede vegetação de nascer na cidade e nos 4
           corredores de saída (DynamicSpawners de inimigos ficam sempre
           fora, a ≥40 do centro — não respeitam SpawnExclusion).
           ============================================================ -->
      <SpawnExclusion at="0 0" radius="30"></SpawnExclusion>

      <!-- Pad de assentamento: aplaina o terreno sob a cidade inteira
           (muralha ±22 + respawns ±28) antes de qualquer placement, com
           anel de blend de 12 m de volta ao relevo natural. Sem ele, o
           terreno acidentado deixa muros e casas com cantos flutuando. -->
      <TerrainPad
        at="0 0"
        size="60 60"
        falloff="12"
        corner-radius="10"
      ></TerrainPad>

      <!-- §4.1 Muralha quadrada (semi-lado 22, altura 3) com 4 portões
           cardeais (vão de 7 m centrado em cada eixo). collider=auto →
           bloqueia o jogador; os portões são a única passagem. -->
      <Composition
        place="at: 0 0; align-to-terrain: 0"
        body="fixed"
        collider="auto"
      >
        <!-- Norte (z=+22), vão central -->
        <Box pos="-12.75 1.5 22" size="18.5 3 0.6" color="#6a5236"></Box>
        <Box pos="12.75 1.5 22" size="18.5 3 0.6" color="#6a5236"></Box>
        <!-- Sul (z=-22) -->
        <Box pos="-12.75 1.5 -22" size="18.5 3 0.6" color="#6a5236"></Box>
        <Box pos="12.75 1.5 -22" size="18.5 3 0.6" color="#6a5236"></Box>
        <!-- Leste (x=+22) -->
        <Box pos="22 1.5 -12.75" size="0.6 3 18.5" color="#6a5236"></Box>
        <Box pos="22 1.5 12.75" size="0.6 3 18.5" color="#6a5236"></Box>
        <!-- Oeste (x=-22) -->
        <Box pos="-22 1.5 -12.75" size="0.6 3 18.5" color="#6a5236"></Box>
        <Box pos="-22 1.5 12.75" size="0.6 3 18.5" color="#6a5236"></Box>
        <!-- Torres de canto (com telhadinho) -->
        <Box pos="22 2.1 22" size="1.4 4.2 1.4" color="#5a4530"></Box>
        <Box pos="-22 2.1 22" size="1.4 4.2 1.4" color="#5a4530"></Box>
        <Box pos="22 2.1 -22" size="1.4 4.2 1.4" color="#5a4530"></Box>
        <Box pos="-22 2.1 -22" size="1.4 4.2 1.4" color="#5a4530"></Box>
        <Box pos="22 4.4 22" size="1.8 0.4 1.8" color="#7a3b28"></Box>
        <Box pos="-22 4.4 22" size="1.8 0.4 1.8" color="#7a3b28"></Box>
        <Box pos="22 4.4 -22" size="1.8 0.4 1.8" color="#7a3b28"></Box>
        <Box pos="-22 4.4 -22" size="1.8 0.4 1.8" color="#7a3b28"></Box>
        <!-- Postes de portão (enquadram cada vão) -->
        <Box pos="-3.5 1.8 22" size="0.5 3.6 0.7" color="#4a3018"></Box>
        <Box pos="3.5 1.8 22" size="0.5 3.6 0.7" color="#4a3018"></Box>
        <Box pos="-3.5 1.8 -22" size="0.5 3.6 0.7" color="#4a3018"></Box>
        <Box pos="3.5 1.8 -22" size="0.5 3.6 0.7" color="#4a3018"></Box>
        <Box pos="22 1.8 -3.5" size="0.7 3.6 0.5" color="#4a3018"></Box>
        <Box pos="22 1.8 3.5" size="0.7 3.6 0.5" color="#4a3018"></Box>
        <Box pos="-22 1.8 -3.5" size="0.7 3.6 0.5" color="#4a3018"></Box>
        <Box pos="-22 1.8 3.5" size="0.7 3.6 0.5" color="#4a3018"></Box>
      </Composition>

      <!-- §4.2 Portões: lintel + braseiro decorativo + estandarte por
           portão. Tudo decorativo (collider none) para o vão ficar
           livre. Cor do estandarte = bioma para onde o portão aponta.
           NOTA: sem PointLight aqui — a engine tem limite de 12 luzes
           pontuais e as 12 estão reservadas para praça/casas/biomas. -->
      <!-- Portão NORTE → Floresta -->
      <Composition
        place="at: 0 22; align-to-terrain: 0"
        body="fixed"
        collider="none"
      >
        <Box pos="0 3.4 0" size="7.5 0.5 0.7" color="#4a3018"></Box>
        <Box pos="-3.2 4.3 0" size="0.12 1.4 0.12" color="#5a3a20"></Box>
        <Box pos="-2.8 4.6 0" size="0.7 0.9 0.06" color="#2a5a34"></Box>
        <Sphere pos="0 3.85 0" size="0.16" color="#ffaa33"></Sphere>
      </Composition>
      <!-- Portão SUL → Pântano -->
      <Composition
        place="at: 0 -22; align-to-terrain: 0"
        body="fixed"
        collider="none"
      >
        <Box pos="0 3.4 0" size="7.5 0.5 0.7" color="#4a3018"></Box>
        <Box pos="3.2 4.3 0" size="0.12 1.4 0.12" color="#5a3a20"></Box>
        <Box pos="2.8 4.6 0" size="0.7 0.9 0.06" color="#3a5a40"></Box>
        <Sphere pos="0 3.85 0" size="0.16" color="#ffaa33"></Sphere>
      </Composition>
      <!-- Portão LESTE → Deserto -->
      <Composition
        place="at: 22 0; align-to-terrain: 0"
        body="fixed"
        collider="none"
      >
        <Box pos="0 3.4 0" size="0.7 0.5 7.5" color="#4a3018"></Box>
        <Box pos="0 4.3 -3.2" size="0.12 1.4 0.12" color="#5a3a20"></Box>
        <Box pos="0 4.6 -2.8" size="0.06 0.9 0.7" color="#c28a3a"></Box>
        <Sphere pos="0 3.85 0" size="0.16" color="#ffaa33"></Sphere>
      </Composition>
      <!-- Portão OESTE → Picos -->
      <Composition
        place="at: -22 0; align-to-terrain: 0"
        body="fixed"
        collider="none"
      >
        <Box pos="0 3.4 0" size="0.7 0.5 7.5" color="#4a3018"></Box>
        <Box pos="0 4.3 3.2" size="0.12 1.4 0.12" color="#5a3a20"></Box>
        <Box pos="0 4.6 2.8" size="0.06 0.9 0.7" color="#5a8ab0"></Box>
        <Sphere pos="0 3.85 0" size="0.16" color="#ffaa33"></Sphere>
      </Composition>

      <!-- §4.3 Praça central: poço, fogueira comunitária e mastro com a
           bandeira da cidade. O herói nasce no centro. -->
      <!-- Poço (sólido) com balde e telhadinho -->
      <Composition
        place="at: -7 6; align-to-terrain: 0"
        body="fixed"
        collider="auto"
      >
        <Cylinder pos="0 0.45 0" size="1.3 1.3 0.9" color="#9a958c"></Cylinder>
        <Cylinder pos="0 0.55 0" size="1.0 1.0 0.1" color="#2f6fb0"></Cylinder>
        <Box pos="-1.15 1.0 0" size="0.16 1.7 0.16" color="#5a3a20"></Box>
        <Box pos="1.15 1.0 0" size="0.16 1.7 0.16" color="#5a3a20"></Box>
        <Box pos="0 1.85 0" size="2.6 0.12 0.12" color="#4a2f18"></Box>
        <Cylinder pos="0 2.4 0" size="0.05 1.5 0.95" color="#7a3b28"></Cylinder>
        <Box pos="0 1.45 0" size="0.5 0.5 0.5" color="#6b4a2b"></Box>
      </Composition>
      <!-- Fogueira comunitária -->
      <Composition
        place="at: 7 -6; align-to-terrain: 0"
        body="fixed"
        collider="none"
      >
        <Cylinder
          pos="0 0.12 0"
          size="1.0 1.15 0.25"
          color="#6f6a63"
        ></Cylinder>
        <Cylinder
          pos="0 0.35 0"
          size="0.12 0.12 1.5"
          rotation="1.5 0 0.2"
          color="#5a3a20"
        ></Cylinder>
        <Cylinder
          pos="0 0.35 0"
          size="0.12 0.12 1.5"
          rotation="1.5 1.0 -0.2"
          color="#6b4a2b"
        ></Cylinder>
        <Sphere pos="0 0.7 0" size="0.55" color="#ff7722"></Sphere>
        <Sphere pos="0 1.05 0" size="0.32" color="#ffcc33"></Sphere>
        <PointLight
          pos="0 1.1 0"
          point-light="color: 0xff8a33; intensity: 3; distance: 10; decay: 2; cast-shadow: 1"
        ></PointLight>
      </Composition>
      <!-- Mastro com bandeira da cidade junto ao poço -->
      <Composition
        place="at: -7 9; align-to-terrain: 0"
        body="fixed"
        collider="none"
      >
        <Box pos="0 2.0 0" size="0.1 4.0 0.1" color="#5a3a20"></Box>
        <Sphere pos="0 4.05 0" size="0.13" color="#d4b84a"></Sphere>
        <Box pos="0.5 3.2 0" size="0.06 1.0 0.8" color="#b03b3b"></Box>
        <Box pos="0.5 3.65 0" size="0.06 0.12 0.84" color="#d4b84a"></Box>
      </Composition>
      <!-- Bancos de pedra virados para a fogueira -->
      <Composition
        place="at: 4.5 -3.5; align-to-terrain: 0"
        body="fixed"
        collider="auto"
      >
        <Box
          pos="0 0.3 0"
          size="1.8 0.3 0.55"
          rotation="0 0.6 0"
          color="#9a958c"
        ></Box>
      </Composition>
      <Composition
        place="at: 9.5 -3.5; align-to-terrain: 0"
        body="fixed"
        collider="auto"
      >
        <Box
          pos="0 0.3 0"
          size="1.8 0.3 0.55"
          rotation="0 -0.6 0"
          color="#9a958c"
        ></Box>
      </Composition>

      <!-- §4.4 Casas nos cantos diagonais (deixam os corredores cardeais
           livres). Cada casa = 1 entidade com corpo fixo e colisores
           compostos. -->
      <!-- Casa NE -->
      <Composition
        place="at: 13 13; align-to-terrain: 0"
        body="fixed"
        collider="auto"
      >
        <Box pos="0 0.1 0" size="5 0.2 5" color="#6b4a2b"></Box>
        <Box pos="0 1.4 -2.4" size="5 2.6 0.3" color="#d8c7a0"></Box>
        <Box pos="-2.4 1.4 0" size="0.3 2.6 5" color="#cdb88f"></Box>
        <Box pos="2.4 1.4 0" size="0.3 2.6 5" color="#cdb88f"></Box>
        <Box pos="-1.7 1.4 2.4" size="1.6 2.6 0.3" color="#d8c7a0"></Box>
        <Box pos="1.7 1.4 2.4" size="1.6 2.6 0.3" color="#d8c7a0"></Box>
        <Box
          pos="-1.3 3.05 0"
          size="3.1 0.2 5.4"
          rotation="0 0 0.62"
          color="#7a3b28"
        ></Box>
        <Box
          pos="1.3 3.05 0"
          size="3.1 0.2 5.4"
          rotation="0 0 -0.62"
          color="#7a3b28"
        ></Box>
        <PointLight
          pos="0 1.5 -0.5"
          point-light="color: 0xffcc88; intensity: 2; distance: 5; decay: 2; cast-shadow: 1"
        ></PointLight>
      </Composition>
      <!-- Casa NW (com horta ao lado) -->
      <Composition
        place="at: -13 13; align-to-terrain: 0"
        body="fixed"
        collider="auto"
      >
        <Box pos="0 0.1 0" size="4.4 0.2 4.4" color="#6b4a2b"></Box>
        <Box pos="0 1.3 -2.1" size="4.4 2.4 0.3" color="#c9b48a"></Box>
        <Box pos="-2.1 1.3 0" size="0.3 2.4 4.4" color="#bfa97e"></Box>
        <Box pos="2.1 1.3 0" size="0.3 2.4 4.4" color="#bfa97e"></Box>
        <Box pos="-1.5 1.3 2.1" size="1.4 2.4 0.3" color="#c9b48a"></Box>
        <Box pos="1.5 1.3 2.1" size="1.4 2.4 0.3" color="#c9b48a"></Box>
        <Box
          pos="-1.15 2.8 0"
          size="2.8 0.2 4.8"
          rotation="0 0 0.6"
          color="#6e4b2a"
        ></Box>
        <Box
          pos="1.15 2.8 0"
          size="2.8 0.2 4.8"
          rotation="0 0 -0.6"
          color="#6e4b2a"
        ></Box>
      </Composition>
      <!-- Horta da casa NW: canteiro + legumes -->
      <Composition
        place="at: -13 8; align-to-terrain: 0"
        body="fixed"
        collider="none"
      >
        <Box pos="0 0.12 0" size="3.4 0.24 1.8" color="#4a3424"></Box>

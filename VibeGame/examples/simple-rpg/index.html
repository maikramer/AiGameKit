<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple RPG Demo — Vale do Cristal (VibeGame)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: center center;
        will-change: transform;
      }

      #controls-hint {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        background: rgba(20, 15, 10, 0.55);
        border: 1px solid rgba(200, 160, 74, 0.35);
        border-radius: 4px;
        color: #e8d8b0;
        font: 12px Georgia, serif;
        letter-spacing: 0.5px;
        pointer-events: none;
        z-index: 50;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <!-- ==================================================================
         VALE DO CRISTAL — MAPA DO MUNDO
         ------------------------------------------------------------------

                              N (+Z) FLORESTA SOMBRIA
                              pinheiros · lobos · sombras
                              clareira da bruxa (chefe)
                                        │
         O (-X) PICOS GELADOS ──── CIDADE MURADA ──── L (+X) DESERTO
         rochedos · goblins          (muralha ±32)    cactos · escorpiões
         cristais · OGRO (final)                      ruínas · VERME
                                        │
                              S (-Z) PÂNTANO
                              salgueiros · boglings
                              choça · BOG WARDEN (chefe)

         ÍNDICE DA CENA
           §0  Céu, luz, pós-processamento, áudio
           §1  Biomas (4 cunhas cardeais)
           §2  Terreno + NavMesh
           §3  Herói
           §4  Cidade murada (muralha, praça, casas, mercado, props)
           §5  Anel do vale (recursos) + goblins de aviso
           §6  Norte  — Floresta Sombria
           §7  Leste  — Deserto
           §8  Sul    — Pântano
           §9  Oeste  — Picos Gelados
           §10 NPCs de quest (3 por bioma)
           §11 Câmera, HUD e UI
           §12 Town demo → public/world/cities/town-demo.xml

         GRUPOS SEMÂNTICOS (<Group name="..."> — contentores na origem):
           environment       §0+§1  céu, luz, pós-proc, áudio, clima, biomas
           world-base        §2+§3  terreno (heightfield+NavMesh) + herói
           city              §4     cidade murada (sub-grupos: walls/plaza/roads/houses/…)
           valley-outskirts  §5     anel de recursos + goblins de aviso
           biome.forest      §6     Norte — Floresta Sombria
           biome.desert      §7     Leste — Deserto
           biome.swamp       §8     Sul — Pântano
           biome.peaks       §9     Oeste — Picos Gelados
           quest-npcs        §10    NPCs de quest + especiais (merchant/boss/chest)
           ui                §11    câmera, HUD, prompts, menu tabbed
           town              §12    DEMO — aldeia isolada (420,420) com sub-grupos

         INVARIANTE: todos os groups top-level ficam em pos="0 0 0" (identidade)
         para não deslocar o mundo. Mover um group desloca todos os filhos via
         hierarquia de transforms (Parent + TransformHierarchySystem). O Terrain
         faz merge no group "world-base" (recipe merge:true), que é também a
         entidade-terreno.


         MAPAS MODULARES (public/world/):
           environment.xml · cities/discordia.xml · cities/town-demo.xml
           spawn/ring.xml · vegetation/crystal-vale.xml
           creatures/enemies.xml · ai/npcs.xml
           Editar o XML do domínio — index.html é só shell + Includes.

         CONTRATOS COM src/main.ts (não alterar sem sincronizar):
           · name="hero" / name="boss" / name="merchant"
           · SpawnExclusion at="0 0" radius="42" (espelha villageZones)
           · Portões cardeais na muralha ±32 (RESPAWN_POINTS usa ±39)
           · Banda de goblins do norte começa em z>=40 (segurança do respawn)
           · dialogue-id de cada NPC == id nos JSON em src/data/quests/
         ================================================================== -->
    <Scene
      canvas="#game-canvas"
      sky="#ffffff"
      resume-audio-on-user-gesture="true"
    >
      <!-- Projectile template used by ranged enemies (e.g. the archer). The
           archer script fires this via spawnProjectileFromTemplate. Visual is
           attached by main.ts's projectile watcher; the template only defines
           kinematics + damage + the 'enemy' faction so hero collision applies. -->
      <ProjectileTemplate
        id="enemy-arrow"
        speed="16"
        damage="8"
        max-life="2.5"
        sensor-radius="0.3"
        faction="enemy"
      ></ProjectileTemplate>
      <!-- ============================================================
           GRUPO "environment": céu, iluminação global, pós-processamento,
           áudio, clima e as 4 cunhas de bioma cardeais. Tudo aqui é global
           (luz ambiente/direcional, skybox, mixer, regiões de bioma) — não
           tem posicionar no mundo, pelo que o Group fica na origem (0 0 0)
           e funciona como contentor semântico. Movê-lo não é expectável,
           mas se algum dia for útil (e.g. skybox offset) todos os filhos
           acompanham via hierarquia de transforms.
           ============================================================ -->
      <Include src="/world/environment.xml"></Include>

      <!-- §3 HERÓI — nasce no centro da praça da cidade. Fora de qualquer
           <Group> porque <PlayerGLTF> é um recipe merge:true: se fosse child
           de um Group, o seu pos="0 40 0" fundir-se-ia no parent e elevaria
           o terreno inteiro (o terrain field lê o WorldTransform.posY da
           entidade onde faz merge). -->
      <PlayerGLTF
        name="hero"
        pos="0 40 0"
        model-url="/assets/meshes/hero_lod2.glb"
      >
      </PlayerGLTF>

      <!-- GRUPO "world-base": terreno (heightfield + NavMesh). O <Terrain>
           é merge:true — o Group TEM de ficar em pos="0 0 0". -->
      <Group name="world-base" pos="0 0 0">
        <!-- ============================================================
           §2 TERRENO + NAVMESH
           Quadtree LOD chunks; world-size/max-height batem com
           public/assets/terrain/terrain.json. Física: uma heightfield
           Rapier por chunk visual, criada/libertada dinamicamente.
           ============================================================ -->
        <Terrain
          pos="0 0 0"
          world-size="2000"
          max-height="200"
          levels="4"
          resolution="64"
          collision-resolution="32"
          lod-hysteresis="1.3"
          lod-distance-ratio="2.4"
          height-smoothing="0.3"
          height-smoothing-spread="1.25"
          heightmap="/assets/terrain/heightmap.png"
          skirt-width="0.015625"
          roughness="0.82"
          metalness="0"
          normal-strength="2.6"
          base-color="#8cb866"
          texture="/assets/textures/vale_grass.png"
          ao-strength="0.9"
          height-blend-strength="0.40"
          snow-height="0.82"
          slope-threshold="0.58"
          slope-softness="0.14"
          color-low="#3a5a2a"
          color-mid="#8cb866"
          color-high="#e8f0ff"
          color-rock="#6a6660"
          noise-sand-strength="0.45"
          noise-sand-scale="0.012"
          noise-sand-threshold="0.56"
          noise-sand-height-min="0.02"
          noise-sand-height-max="0.50"
        ></Terrain>

        <NavMesh></NavMesh>
      </Group>
      <!-- FIM world-base -->

      <Include src="/world/cities/discordia.xml"></Include>
      <Include src="/world/spawn/ring.xml"></Include>
      <Include src="/world/vegetation/crystal-vale.xml"></Include>
      <Include src="/world/clutter/crystal-vale.xml"></Include>
      <Include src="/world/atmosphere/ambient-fx.xml"></Include>
      <Include src="/world/creatures/enemies.xml"></Include>
      <Include src="/world/ai/npcs.xml"></Include>

      <!-- Câmera 3ª pessoa. Fora de qualquer <Group> porque
           <ThirdPersonCamera> é merge:true — dentro de um Group, a stack de
           câmera fundir-se-ia no parent em vez de criar a sua própria entidade.
           Teclas 1-6 alternam pós-processamento. -->
      <ThirdPersonCamera
        distance="3.3"
        height="1.55"
        pitch="0.32"
        fov="64"
        near="0.12"
        far="130"
        follow-lag="0.18"
        turn-lag="0.38"
        mouse-sensitivity="0.003"
      ></ThirdPersonCamera>

      <!-- GRUPO "ui": HUD (health/xp/bars/minimap/compass), prompts de
           diálogo, e o menu tabbed (pause/inventário/skills/opções/quests).
           Elementos DOM; o Group serve como contentor lógico. -->
      <Group name="ui" pos="0 0 0">
        <!-- ============================================================
           §11 CÂMERA, HUD E UI
           ============================================================ -->
        <PostFxDebugToggle></PostFxDebugToggle>

        <!-- HUD: camada declarativa screen-space + widgets (engine HudPlugin). -->
        <HudScreenLayer></HudScreenLayer>
        <HealthBar
          target-entity="hero"
          icon="/assets/icons/hud_health.png"
        ></HealthBar>
        <XpBar target-entity="hero"></XpBar>
        <ResourceChip
          resource="gold"
          icon="/assets/icons/hud_gold.png"
          target-entity="hero"
        ></ResourceChip>
        <ResourceChip
          resource="wood"
          icon="/assets/icons/hud_wood.png"
          target-entity="hero"
        ></ResourceChip>
        <ResourceChip
          resource="stone"
          icon="/assets/icons/hud_stone.png"
          target-entity="hero"
        ></ResourceChip>
        <Minimap range="60"></Minimap>
        <Compass></Compass>
        <TargetBar></TargetBar>
        <BossBar target-entity="boss"></BossBar>
        <InteractionPrompt
          key="F"
          range="4.5"
          position="bottom-center"
        ></InteractionPrompt>

        <!-- Diálogo (instância única). QuestTriggerSystem abre ao [F] perto
           de um <DialogueNPC>; QuestsTab lista as quests ativas. -->
        <DialogueBalloon></DialogueBalloon>

        <!-- Menu de pausa: modal tabbed com [Q]. -->
        <TabbedModal
          id="pause"
          key="q"
          target-entity="hero"
          title-key="modal.pause"
        >
          <InventoryTab columns="5"></InventoryTab>
          <SkillsTab></SkillsTab>
          <OptionsTab label-key="modal.tab.system">
            <OptionRow
              id="music-volume"
              type="slider"
              label-key="options.music"
              min="0"
              max="100"
              step="5"
              default="70"
            ></OptionRow>
            <OptionRow
              id="sfx-volume"
              type="slider"
              label-key="options.sfx"
              min="0"
              max="100"
              step="5"
              default="80"
            ></OptionRow>
            <OptionRow
              id="save"
              type="button"
              label-key="options.save"
            ></OptionRow>
            <OptionRow
              id="load"
              type="button"
              label-key="options.load"
            ></OptionRow>
            <OptionRow
              id="controls"
              type="note"
              label-key="options.controls"
            ></OptionRow>
          </OptionsTab>
          <WikiTab></WikiTab>
          <QuestsTab></QuestsTab>
        </TabbedModal>
      </Group>
      <!-- FIM ui -->

      <Include src="/world/cities/town-demo.xml"></Include>
    </Scene>

    <canvas id="game-canvas"></canvas>
    <div id="controls-hint">
      WASD mover · Espaço pular · J atacar · F interagir · K comércio · B bomba
      · Q menu · P profiler (?profiler=1)
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

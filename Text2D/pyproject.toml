[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2d"
version = "0.1.0"
description = "CLI Text-to-2D com FLUX.3 Image Klein (SDNQ) para GPUs modestas"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Text2D Project" }]
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "diffusers>=0.42.0",
    "transformers>=5.14.0",
    "accelerate>=0.24.0",
    "huggingface-hub>=1.32.0,<2",
    "safetensors>=0.4.0",
    "sdnq>=0.2.9",
    "numpy>=1.24.0",
    "scipy>=1.11",
    "Pillow>=10.0.0",
    "click>=8.1.0",
    "rembg>=2.0.0",
    "rich>=13.0.0",
    "rich-click>=1.8.0",
    "vtracer>=0.6.15",
    "aigamekit-shared[gpu,image] @ file:../Shared",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.0",
]
# --svg-preview rasteriza o SVG para QA. Fica fora do core porque precisa de
# libcairo no sistema e o servidor remoto não tem de a ter.
svg-preview = ["cairosvg>=2.7"]

[project.scripts]
text2d = "text2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
text2d = [
    "cursor_skill/*.md",
    "svg/vendor/starvector/LICENSE",
    "svg/vendor/starvector/NOTICE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

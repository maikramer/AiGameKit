[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelserver"
version = "0.1.0"
description = "Unified Model Server — supervisor único de VRAM para todas as ferramentas GPU do monorepo"
readme = "README.md"
authors = [{ name = "GameDev Project" }]
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "rich-click>=1.8.0",
    "PyYAML>=6.0",
    "gamedev-shared @ file:../Shared",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
gamedev-model-server = "modelserver.cli:main"
ums = "modelserver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelserver = ["data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
